<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />
  <title>字迹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0d0b;
      --fg: #e6dfd0;
      --muted: #8f8778;
      --soft: #3a362e;
      --jade: #7a9a84;
      --ember: #c9845a;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Noto Serif SC", serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      max-width: 480px;
      margin: 0 auto;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 45% at 50% -5%, rgba(122, 154, 132, 0.1), transparent 55%),
        radial-gradient(ellipse 70% 35% at 80% 100%, rgba(201, 132, 90, 0.06), transparent 50%);
      z-index: 0;
    }

    .screen {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(1.25rem + var(--safe-t)) 1.25rem calc(1.25rem + var(--safe-b));
    }

    .hidden { display: none !important; }

    .brand {
      font-size: 0.72rem;
      letter-spacing: 0.42em;
      color: var(--jade);
      margin-bottom: 1rem;
    }

    .title {
      font-weight: 300;
      font-size: 2.15rem;
      letter-spacing: 0.22em;
      line-height: 1.25;
    }

    .sub {
      margin-top: 0.7rem;
      font-weight: 300;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.7;
      letter-spacing: 0.08em;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      align-content: start;
      padding: 1.1rem 0 0.4rem;
      overflow-y: auto;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      appearance: none;
      border: 1px solid rgba(230, 223, 208, 0.1);
      background: linear-gradient(165deg, rgba(28, 26, 22, 0.95), rgba(14, 13, 11, 0.5));
      color: var(--fg);
      border-radius: 2px;
      padding: 1.05rem 0.75rem 0.95rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s;
    }

    .card:active { transform: scale(0.97); }
    .card:hover, .card:focus-visible {
      border-color: rgba(122, 154, 132, 0.45);
      outline: none;
    }

    .card .g {
      display: block;
      font-size: 2.15rem;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 0.55rem;
    }

    .card .m {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      color: var(--muted);
    }

    .foot-hint {
      flex-shrink: 0;
      font-size: 0.72rem;
      color: var(--soft);
      letter-spacing: 0.16em;
      text-align: center;
    }

    body.film {
      max-width: none;
      background: #000;
    }

    body.film::before { opacity: 0; }

    .story {
      position: fixed;
      inset: 0;
      height: 100dvh;
      display: block;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    .world {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, transparent 30%, rgba(0,0,0,0.55) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 18%, transparent 72%, rgba(0,0,0,0.72) 100%);
    }

    .grain {
      position: absolute;
      inset: -20%;
      z-index: 7;
      pointer-events: none;
      opacity: 0.22;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grainShift 0.45s steps(4) infinite;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 5;
      background: #000;
      pointer-events: none;
    }

    .letterbox.top {
      top: 0;
      height: calc(7.6vh + var(--safe-t));
      min-height: calc(48px + var(--safe-t));
    }

    .letterbox.bot {
      bottom: 0;
      height: calc(26vh + var(--safe-b));
      min-height: calc(168px + var(--safe-b));
    }

    .story-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(7.6vh + var(--safe-t));
      min-height: calc(48px + var(--safe-t));
      padding: var(--safe-t) 1.15rem 0;
      opacity: 0.7;
    }

    .stage {
      position: absolute;
      top: calc(7.6vh + var(--safe-t));
      bottom: calc(26vh + var(--safe-b));
      left: 0;
      right: 0;
      z-index: 3;
      margin: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glyph-frame canvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.45));
    }

    .story-copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(5.6vh + var(--safe-b));
      z-index: 6;
      flex-shrink: 0;
      padding: 0.2rem 1.7rem 0;
      min-height: 0;
      text-align: center;
    }

    .era {
      font-size: 0.68rem;
      letter-spacing: 0.42em;
      color: rgba(232, 210, 170, 0.7);
      margin-bottom: 0.55rem;
      text-shadow: 0 2px 18px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.45s, transform 0.45s;
    }

    .era.show { opacity: 1; transform: none; }

    .line {
      font-weight: 300;
      font-size: 0.98rem;
      line-height: 1.9;
      letter-spacing: 0.08em;
      min-height: 3.4em;
      color: rgba(236, 228, 214, 0.92);
      text-shadow: 0 2px 16px rgba(0,0,0,0.85);
    }

    .line .cursor {
      display: inline-block;
      width: 0.45em;
      height: 0.95em;
      margin-left: 2px;
      background: var(--jade);
      vertical-align: -0.08em;
      animation: blink 1s steps(1) infinite;
    }

    .dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(2.4vh + var(--safe-b));
      z-index: 6;
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      padding: 0;
      opacity: 0.45;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--soft);
      transition: background 0.3s, transform 0.3s;
    }

    .dot.on {
      background: var(--jade);
      transform: scale(1.35);
    }

    .source {
      position: absolute;
      left: 1.1rem;
      bottom: calc(1.1vh + var(--safe-b));
      z-index: 6;
      font-size: 0.52rem;
      letter-spacing: 0.08em;
      color: rgba(143, 135, 120, 0.28);
      max-width: 42%;
      line-height: 1.4;
      pointer-events: none;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(-1%, 2%); }
      100% { transform: translate(0, 0); }
    }

    .back, .skip {
      appearance: none;
      background: none;
      border: none;
      color: rgba(230, 223, 208, 0.42);
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      padding: 0.5rem 0.2rem;
      cursor: pointer;
    }

    .chapter {
      font-size: 0.62rem;
      letter-spacing: 0.42em;
      color: rgba(232, 210, 170, 0.45);
    }

    .glyph-frame {
      position: relative;
      width: min(78vw, 320px);
      aspect-ratio: 1;
      max-height: min(48dvh, 360px);
    }

    .tap-zone {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
    }

    .hint-tap {
      margin-top: 0.55rem;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      color: rgba(143, 135, 120, 0.55);
      opacity: 0;
      transition: opacity 0.5s;
    }

    .hint-tap.show { opacity: 1; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <section class="screen" id="gallery">
    <div>
      <p class="brand">字迹</p>
      <h1 class="title">一画开天</h1>
      <p class="sub">点开一个字，看它从甲骨走到简体。</p>
    </div>
    <div class="grid" id="grid"></div>
    <p class="foot-hint">甲骨 · 金文 · 小篆 · 隶书 · 简体</p>
  </section>

  <section class="story hidden" id="story">
    <canvas class="world" id="world" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="letterbox top"></div>
    <div class="letterbox bot"></div>
    <div class="story-bar">
      <button type="button" class="back" id="btnBack">返回</button>
      <span class="chapter" id="chapter">01 / 05</span>
      <button type="button" class="skip" id="btnSkip">关闭</button>
    </div>
    <div class="stage" id="stage">
      <div class="glyph-frame" id="glyphFrame">
        <canvas id="glyphCanvas" width="360" height="360" aria-hidden="true"></canvas>
      </div>
      <div class="tap-zone" id="tap" aria-label="返回"></div>
    </div>
    <div class="story-copy">
      <div class="era" id="era"></div>
      <div class="line" id="line"></div>
      <div class="hint-tap" id="hintTap">演化中…</div>
    </div>
    <div class="dots" id="dots"></div>
    <p class="source">字形参考：Wikimedia Commons 古汉字 / 《说文解字》</p>
  </section>

  <script>
    const SIZE = 360;
    const INK = [230, 223, 208];
    const SAMPLE_STEP = 2;
    const MORPH_MS = 1700;

    const WORLDS = [
      {
        top: [58, 28, 12], mid: [118, 62, 28], bot: [22, 11, 6],
        haze: [214, 156, 88], disc: [255, 176, 92], weather: "sand",
        horizon: 0.66, discY: 0.28, wind: 1.35,
      },
      {
        top: [10, 6, 8], mid: [62, 26, 12], bot: [118, 46, 14],
        haze: [255, 132, 48], disc: [255, 150, 70], weather: "ember",
        horizon: 0.78, discY: 0.72, wind: 0.4,
      },
      {
        top: [26, 36, 34], mid: [52, 64, 58], bot: [14, 18, 16],
        haze: [168, 196, 176], disc: [210, 220, 200], weather: "ash",
        horizon: 0.6, discY: 0.22, wind: 0.2,
      },
      {
        top: [16, 20, 32], mid: [30, 36, 52], bot: [6, 8, 14],
        haze: [150, 172, 204], disc: [186, 198, 220], weather: "rain",
        horizon: 0.74, discY: 0.18, wind: 0.55,
      },
      {
        top: [18, 30, 48], mid: [40, 56, 74], bot: [8, 10, 16],
        haze: [186, 210, 232], disc: [240, 220, 190], weather: "haze",
        horizon: 0.7, discY: 0.36, wind: 0.18,
      },
    ];

    const gallery = document.getElementById("gallery");
    const storyEl = document.getElementById("story");
    const grid = document.getElementById("grid");
    const canvas = document.getElementById("glyphCanvas");
    const ctx = canvas.getContext("2d", { alpha: true, willReadFrequently: true });
    const worldEl = document.getElementById("world");
    const wctx = worldEl.getContext("2d", { alpha: false });
    const eraEl = document.getElementById("era");
    const lineEl = document.getElementById("line");
    const dotsEl = document.getElementById("dots");
    const chapterEl = document.getElementById("chapter");
    const tap = document.getElementById("tap");
    const hintTap = document.getElementById("hintTap");

    let ERAS = [];
    let STORIES = [];
    let current = null;
    let chapter = 0;
    let typing = null;
    let autoPlaying = false;
    let autoTimer = 0;
    let playToken = 0;
    let morphRaf = 0;
    let pointClouds = [];
    let bitmaps = [];
    let morphPairs = [];
    let pixelBuf = ctx.createImageData(SIZE, SIZE);
    let fontsReady = null;
    let glyphSheets = [];
    let idleRaf = 0;
    let idleIdx = 0;
    let idleT0 = 0;
    let worldRaf = 0;
    let worldT0 = 0;
    let worldFrom = 0;
    let worldTo = 0;
    let worldBlend = 1;
    const specks = Array.from({ length: 28 }, () => ({
      x: Math.random(),
      y: Math.random(),
      s: 0.4 + Math.random() * 1.2,
      p: Math.random() * Math.PI * 2,
    }));
    const weatherBits = Array.from({ length: 96 }, () => ({
      x: Math.random(),
      y: Math.random(),
      s: 0.35 + Math.random() * 1.4,
      p: Math.random() * Math.PI * 2,
      z: 0.35 + Math.random() * 0.9,
    }));

    function mix3(a, b, t) {
      return [
        a[0] + (b[0] - a[0]) * t,
        a[1] + (b[1] - a[1]) * t,
        a[2] + (b[2] - a[2]) * t,
      ];
    }

    function mixWorld(a, b, t) {
      return {
        top: mix3(a.top, b.top, t),
        mid: mix3(a.mid, b.mid, t),
        bot: mix3(a.bot, b.bot, t),
        haze: mix3(a.haze, b.haze, t),
        disc: mix3(a.disc, b.disc, t),
        weather: t < 0.5 ? a.weather : b.weather,
        weatherFrom: a.weather,
        weatherTo: b.weather,
        horizon: a.horizon + (b.horizon - a.horizon) * t,
        discY: a.discY + (b.discY - a.discY) * t,
        wind: a.wind + (b.wind - a.wind) * t,
        blend: t,
      };
    }

    function rgb(c, a) {
      return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
    }

    function resizeWorld() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = window.innerWidth;
      const h = window.innerHeight;
      worldEl.width = Math.max(1, Math.floor(w * dpr));
      worldEl.height = Math.max(1, Math.floor(h * dpr));
      worldEl.style.width = w + "px";
      worldEl.style.height = h + "px";
      wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function startWorld(i) {
      document.body.classList.add("film");
      worldFrom = i;
      worldTo = i;
      worldBlend = 1;
      resizeWorld();
      worldT0 = performance.now();
      cancelAnimationFrame(worldRaf);
      const tick = (now) => {
        if (!current) return;
        paintWorld((now - worldT0) / 1000);
        worldRaf = requestAnimationFrame(tick);
      };
      worldRaf = requestAnimationFrame(tick);
    }

    function stopWorld() {
      cancelAnimationFrame(worldRaf);
      worldRaf = 0;
      document.body.classList.remove("film");
    }

    function paintWorld(t) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const scene = mixWorld(
        WORLDS[worldFrom] || WORLDS[0],
        WORLDS[worldTo] || WORLDS[0],
        worldBlend
      );
      const motion = current && current.motion;
      const kenX = Math.sin(t * 0.11) * 18;
      const kenY = Math.cos(t * 0.08) * 10;
      const kenZ = 1.04 + Math.sin(t * 0.07) * 0.03;

      wctx.setTransform(1, 0, 0, 1, 0, 0);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      wctx.save();
      wctx.translate(w / 2, h / 2);
      wctx.scale(kenZ, kenZ);
      wctx.translate(-w / 2 + kenX, -h / 2 + kenY);

      const sky = wctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, rgb(scene.top, 1));
      sky.addColorStop(0.42, rgb(scene.mid, 1));
      sky.addColorStop(scene.horizon, rgb(mix3(scene.mid, scene.bot, 0.35), 1));
      sky.addColorStop(1, rgb(scene.bot, 1));
      wctx.fillStyle = sky;
      wctx.fillRect(-40, -40, w + 80, h + 80);

      drawSkyDisc(w, h, t, scene, motion);
      drawClouds(w, h, t, scene);
      if (motion === "mountain") drawRidges(w, h, scene, t);
      if (motion === "water" || scene.weather === "rain") drawWaterline(w, h, t, scene, motion === "water" ? 1 : 0.45);

      wctx.restore();

      drawWeather(w, h, t, scene, motion);
      if (motion === "fire" && scene.weather !== "ember") {
        paintWeatherKind("ember", 0.4, w, h, t, scene, motion);
      }
      if (motion === "rain" && scene.weather !== "rain") {
        paintWeatherKind("rain", 0.5, w, h, t, scene, motion);
      }
      if (motion === "gallop" && scene.weather !== "sand") {
        paintWeatherKind("sand", 0.28, w, h, t, scene, motion);
      }

      const bloom = wctx.createRadialGradient(w * 0.5, h * 0.42, 20, w * 0.5, h * 0.42, Math.max(w, h) * 0.42);
      bloom.addColorStop(0, rgb(scene.haze, 0.16));
      bloom.addColorStop(0.45, rgb(scene.haze, 0.05));
      bloom.addColorStop(1, "rgba(0,0,0,0)");
      wctx.fillStyle = bloom;
      wctx.fillRect(0, 0, w, h);

      if (scene.weatherTo === "ember" || scene.weatherFrom === "ember") {
        wctx.fillStyle = `rgba(255,120,40,${0.03 + 0.04 * Math.abs(Math.sin(t * 7))})`;
        wctx.fillRect(0, 0, w, h);
      }
    }

    function drawSkyDisc(w, h, t, scene, motion) {
      const isMoon = motion === "moon";
      const hide = scene.weather === "rain" && worldBlend > 0.7 && motion !== "sun";
      if (hide) return;
      const cx = w * (0.62 + Math.sin(t * 0.05) * 0.04);
      const cy = h * scene.discY;
      const r = (motion === "sun" ? 0.11 : 0.08) * Math.min(w, h);
      const pulse = 1 + Math.sin(t * 1.4) * 0.04;
      const g = wctx.createRadialGradient(cx, cy, 0, cx, cy, r * 3.2 * pulse);
      g.addColorStop(0, rgb(scene.disc, isMoon ? 0.55 : 0.42));
      g.addColorStop(0.28, rgb(scene.disc, 0.16));
      g.addColorStop(1, "rgba(0,0,0,0)");
      wctx.fillStyle = g;
      wctx.beginPath();
      wctx.arc(cx, cy, r * 3.2 * pulse, 0, Math.PI * 2);
      wctx.fill();
      wctx.fillStyle = rgb(scene.disc, isMoon ? 0.78 : 0.55);
      wctx.beginPath();
      wctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
      wctx.fill();
      if (isMoon) {
        wctx.fillStyle = rgb(scene.top, 1);
        wctx.beginPath();
        wctx.arc(cx + r * 0.38, cy - r * 0.16, r * 0.86, 0, Math.PI * 2);
        wctx.fill();
        wctx.fillStyle = rgb(scene.haze, 0.22);
        for (let i = 8; i < 22; i++) {
          const b = weatherBits[i];
          wctx.globalAlpha = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.3 + b.p));
          wctx.beginPath();
          wctx.arc(b.x * w * 0.9 + 20, b.y * h * 0.38 + 20, 0.7 + b.s * 0.6, 0, Math.PI * 2);
          wctx.fill();
        }
        wctx.globalAlpha = 1;
      }
    }

    function drawClouds(w, h, t, scene) {
      wctx.fillStyle = rgb(scene.haze, 0.07);
      for (let i = 0; i < 5; i++) {
        const b = weatherBits[i];
        const x = ((b.x * w + Math.sin(t * 0.12 + b.p) * 40 + t * 8 * scene.wind * b.z) % (w + 220)) - 110;
        const y = h * (0.16 + b.y * 0.22);
        wctx.beginPath();
        wctx.ellipse(x, y, 90 * b.z + 40, 18 * b.z + 10, 0, 0, Math.PI * 2);
        wctx.fill();
      }
    }

    function drawRidges(w, h, scene, t) {
      const hy = h * scene.horizon;
      wctx.beginPath();
      wctx.moveTo(-20, h + 20);
      wctx.lineTo(-20, hy);
      for (let x = 0; x <= w + 20; x += 18) {
        const y = hy - 28 - Math.abs(Math.sin(x * 0.012 + t * 0.05)) * 52 - Math.sin(x * 0.03) * 12;
        wctx.lineTo(x, y);
      }
      wctx.lineTo(w + 20, h + 20);
      wctx.closePath();
      wctx.fillStyle = rgb(mix3(scene.bot, scene.mid, 0.25), 0.85);
      wctx.fill();
    }

    function drawWaterline(w, h, t, scene, amp) {
      const y0 = h * (scene.horizon + 0.04);
      wctx.beginPath();
      wctx.moveTo(-20, h + 20);
      wctx.lineTo(-20, y0);
      for (let x = 0; x <= w + 20; x += 10) {
        wctx.lineTo(x, y0 + Math.sin(x * 0.03 + t * 2.2) * 6 * amp);
      }
      wctx.lineTo(w + 20, h + 20);
      wctx.closePath();
      wctx.fillStyle = rgb(mix3(scene.bot, scene.haze, 0.25), 0.55);
      wctx.fill();
    }

    function drawWeather(w, h, t, scene, motion) {
      const aFrom = 1 - scene.blend;
      const aTo = scene.blend;
      paintWeatherKind(scene.weatherFrom, aFrom, w, h, t, scene, motion);
      if (scene.weatherTo !== scene.weatherFrom) {
        paintWeatherKind(scene.weatherTo, aTo, w, h, t, scene, motion);
      }
    }

    function paintWeatherKind(kind, alpha, w, h, t, scene, motion) {
      if (alpha < 0.02) return;
      const boostRain = motion === "rain" ? 1.6 : 1;
      const boostEmber = motion === "fire" ? 1.5 : 1;
      const boostSand = motion === "gallop" || motion === "cart" ? 1.4 : 1;
      wctx.save();
      if (kind === "sand") {
        wctx.strokeStyle = rgb(scene.haze, 0.18 * alpha * boostSand);
        wctx.lineWidth = 1;
        for (let i = 0; i < 70; i++) {
          const b = weatherBits[i];
          const x = ((b.x * w + t * (90 + b.s * 80) * scene.wind) % (w + 40)) - 20;
          const y = ((b.y * h + Math.sin(t * 0.8 + b.p) * 12) % h);
          wctx.globalAlpha = (0.15 + b.z * 0.35) * alpha;
          wctx.beginPath();
          wctx.moveTo(x, y);
          wctx.lineTo(x - 14 * b.s * scene.wind, y + 1);
          wctx.stroke();
        }
      } else if (kind === "ember") {
        for (let i = 0; i < 64; i++) {
          const b = weatherBits[i];
          const y = h - ((t * (40 + b.s * 70) * boostEmber + b.y * h) % (h * 0.9));
          const x = b.x * w + Math.sin(y * 0.02 + b.p) * 18;
          wctx.fillStyle = rgb(scene.disc, (0.12 + b.z * 0.4) * alpha * boostEmber);
          wctx.beginPath();
          wctx.arc(x, y, 1.1 * b.s, 0, Math.PI * 2);
          wctx.fill();
        }
      } else if (kind === "ash") {
        for (let i = 0; i < 50; i++) {
          const b = weatherBits[i];
          const y = ((t * (12 + b.s * 18) + b.y * h) % h);
          const x = b.x * w + Math.sin(t * 0.4 + b.p) * 22;
          wctx.fillStyle = rgb(scene.haze, (0.08 + b.z * 0.22) * alpha);
          wctx.beginPath();
          wctx.ellipse(x, y, 2.4 * b.s, 1.1, b.p, 0, Math.PI * 2);
          wctx.fill();
        }
      } else if (kind === "rain") {
        wctx.strokeStyle = rgb(scene.haze, 0.22 * alpha * boostRain);
        wctx.lineWidth = 1.1;
        for (let i = 0; i < 80; i++) {
          const b = weatherBits[i];
          const y = ((t * (220 + b.s * 140) * boostRain + b.y * h) % (h + 30)) - 15;
          const x = b.x * w + t * 18 * scene.wind;
          wctx.globalAlpha = (0.18 + b.z * 0.35) * alpha * boostRain;
          wctx.beginPath();
          wctx.moveTo(x, y);
          wctx.lineTo(x - 4, y + 16 + b.s * 10);
          wctx.stroke();
        }
      } else {
        for (let i = 0; i < 36; i++) {
          const b = weatherBits[i];
          const x = b.x * w + Math.sin(t * 0.25 + b.p) * 30;
          const y = b.y * h + Math.cos(t * 0.18 + b.p) * 16;
          wctx.fillStyle = rgb(scene.haze, (0.05 + b.z * 0.12) * alpha);
          wctx.beginPath();
          wctx.arc(x, y, 18 * b.z, 0, Math.PI * 2);
          wctx.fill();
        }
      }
      wctx.restore();
    }

    function easeInOutQuint(t) {
      return t < 0.5
        ? 16 * t * t * t * t * t
        : 1 - Math.pow(-2 * t + 2, 5) / 2;
    }

    function easeMorph(t) {
      return easeInOutQuint(t);
    }

    function renderGallery() {
      grid.innerHTML = STORIES.map(
        (s) => `<button type="button" class="card" data-id="${s.id}">
          <span class="g">${s.glyph}</span>
          <span class="m">${s.meaning}</span>
        </button>`
      ).join("");
    }

    function parseViewBox(vb) {
      const p = (vb || "0 0 300 300").trim().split(/[\s,]+/).map(Number);
      return { x: p[0] || 0, y: p[1] || 0, w: p[2] || 300, h: p[3] || 300 };
    }

    async function rasterizeForm(form) {
      fontsReady = fontsReady || document.fonts.ready;
      await fontsReady;
      const off = document.createElement("canvas");
      off.width = SIZE;
      off.height = SIZE;
      const octx = off.getContext("2d", { willReadFrequently: true });
      octx.clearRect(0, 0, SIZE, SIZE);

      const textMatch = form.body && form.body.match(/<text\b[^>]*>([^<]*)<\/text>/i);
      if (textMatch) {
        const ch = textMatch[1];
        const isClerical = /scale\(1\.08/.test(form.body);
        octx.fillStyle = "#e6dfd0";
        octx.textAlign = "center";
        octx.textBaseline = "middle";
        octx.font = `500 ${isClerical ? 200 : 216}px "Noto Serif SC", serif`;
        if (isClerical) {
          octx.save();
          octx.translate(SIZE / 2, SIZE / 2 + 6);
          octx.scale(1.08, 0.92);
          octx.fillText(ch, 0, 0);
          octx.restore();
        } else {
          octx.fillText(ch, SIZE / 2, SIZE / 2 + 8);
        }
      } else {
        const vb = parseViewBox(form.viewBox);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" width="${SIZE}" height="${SIZE}">${form.body}</svg>`;
        const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
        try {
          const img = await loadImage(url);
          octx.drawImage(img, 0, 0, SIZE, SIZE);
        } finally {
          URL.revokeObjectURL(url);
        }
      }
      const img = octx.getImageData(0, 0, SIZE, SIZE);
      inkOnly(img);
      return img;
    }

    function inkOnly(imageData) {
      const data = imageData.data;
      const r = INK[0];
      const g = INK[1];
      const b = INK[2];
      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3];
        if (!a) {
          data[i] = data[i + 1] = data[i + 2] = 0;
          continue;
        }
        data[i] = r;
        data[i + 1] = g;
        data[i + 2] = b;
      }
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    function samplePoints(imageData) {
      const { data, width, height } = imageData;
      const pts = [];
      for (let y = 0; y < height; y += SAMPLE_STEP) {
        for (let x = 0; x < width; x += SAMPLE_STEP) {
          const a = data[(y * width + x) * 4 + 3];
          if (a > 40) {
            const w = a / 255;
            pts.push({
              x: x + 0.5,
              y: y + 0.5,
              w,
              key: Math.atan2(y - height / 2, x - width / 2) * 1000 + Math.hypot(x - width / 2, y - height / 2) * 0.01,
            });
          }
        }
      }
      pts.sort((a, b) => a.key - b.key);
      return pts;
    }

    function matchClouds(from, to) {
      const n = Math.max(from.length, to.length, 1);
      const A = densify(from, n);
      const B = densify(to, n);
      const paired = new Array(n);
      for (let i = 0; i < n; i++) {
        paired[i] = {
          x0: A[i].x,
          y0: A[i].y,
          w0: A[i].w,
          x1: B[i].x,
          y1: B[i].y,
          w1: B[i].w,
          scatter: (Math.random() - 0.5) * 5,
          scatterY: (Math.random() - 0.5) * 5,
          delay: (i % 7) * 0.012,
        };
      }
      return paired;
    }

    function densify(pts, n) {
      if (!pts.length) {
        const cx = SIZE / 2;
        const cy = SIZE / 2;
        return Array.from({ length: n }, (_, i) => {
          const a = (i / n) * Math.PI * 2;
          return { x: cx + Math.cos(a) * 4, y: cy + Math.sin(a) * 4, w: 0.2 };
        });
      }
      if (pts.length === n) return pts.slice();
      if (pts.length > n) {
        const out = [];
        for (let i = 0; i < n; i++) out.push(pts[Math.floor((i / n) * pts.length)]);
        return out;
      }
      const out = pts.slice();
      let i = 0;
      while (out.length < n) {
        const p = pts[i % pts.length];
        out.push({
          x: p.x + (Math.random() - 0.5) * 1.2,
          y: p.y + (Math.random() - 0.5) * 1.2,
          w: p.w,
        });
        i += 1;
      }
      return out;
    }

    function drawPoints(points, t = 1) {
      const buf = pixelBuf.data;
      buf.fill(0);
      const r = INK[0];
      const g = INK[1];
      const b = INK[2];

      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const span = 1 - p.delay;
        const local = span <= 0 ? 1 : Math.max(0, Math.min(1, (t - p.delay) / span));
        const e = easeMorph(local);
        const lift = Math.sin(e * Math.PI);
        const x = p.x0 + (p.x1 - p.x0) * e + p.scatter * lift;
        const y = p.y0 + (p.y1 - p.y0) * e + p.scatterY * lift;
        const w = p.w0 + (p.w1 - p.w0) * e;
        const alpha = Math.max(0.22, w) * (0.72 + 0.28 * (1 - lift * 0.25));
        const add = (alpha * 255) | 0;

        const ix = x | 0;
        const iy = y | 0;
        if (ix < 0 || iy < 0 || ix >= SIZE || iy >= SIZE) continue;
        const idx = (iy * SIZE + ix) * 4;
        const next = buf[idx + 3] + add;
        buf[idx + 3] = next > 255 ? 255 : next;
      }

      for (let i = 0; i < buf.length; i += 4) {
        if (!buf[i + 3]) continue;
        buf[i] = r;
        buf[i + 1] = g;
        buf[i + 2] = b;
      }
      ctx.putImageData(pixelBuf, 0, 0);
    }

    function drawBitmap(i) {
      if (!bitmaps[i]) return;
      ctx.putImageData(bitmaps[i], 0, 0);
    }

    function stopIdle() {
      cancelAnimationFrame(idleRaf);
      idleRaf = 0;
    }

    function startIdle(i) {
      stopIdle();
      idleIdx = i;
      idleT0 = performance.now();
      const tick = (now) => {
        if (!current) return;
        paintAlive(i, (now - idleT0) / 1000);
        idleRaf = requestAnimationFrame(tick);
      };
      idleRaf = requestAnimationFrame(tick);
    }

    function eraAmp(i) {
      return [1, 0.88, 0.68, 0.42, 0.26][i] ?? 0.4;
    }

    function paintAlive(i, t) {
      const sheet = glyphSheets[i];
      if (!sheet) {
        drawBitmap(i);
        return;
      }
      const amp = eraAmp(i);
      const motion = current.motion || "pulse";
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.save();
      ctx.translate(SIZE / 2, SIZE / 2);

      if (motion === "gallop") {
        const beat = t * 7.2;
        const hoof = Math.abs(Math.sin(beat));
        ctx.translate((-18 + hoof * 36) * amp, Math.sin(beat * 2) * 7 * amp);
        ctx.rotate(Math.sin(beat) * 0.09 * amp);
        ctx.scale(1 + hoof * 0.04 * amp, 1 - hoof * 0.05 * amp);
      } else if (motion === "swim") {
        ctx.translate(Math.sin(t * 2.2) * 10 * amp, Math.sin(t * 1.1) * 4 * amp);
        ctx.rotate(Math.sin(t * 2.2) * 0.06 * amp);
      } else if (motion === "cart") {
        ctx.translate(Math.sin(t * 5) * 6 * amp, Math.abs(Math.sin(t * 10)) * 3 * amp);
        ctx.rotate(Math.sin(t * 5) * 0.03 * amp);
      } else if (motion === "walk") {
        ctx.translate(Math.sin(t * 3.2) * 8 * amp, Math.abs(Math.sin(t * 6.4)) * 3 * amp);
        ctx.rotate(Math.sin(t * 3.2) * 0.05 * amp);
      } else if (motion === "fire") {
        const f = 1 + Math.sin(t * 11) * 0.035 * amp + Math.sin(t * 17) * 0.02 * amp;
        ctx.translate(Math.sin(t * 23) * 1.4 * amp, Math.sin(t * 8) * 4 * amp);
        ctx.scale(f, 1 + (f - 1) * 1.4);
      } else if (motion === "tree") {
        ctx.rotate(Math.sin(t * 1.3) * 0.045 * amp);
      } else if (motion === "sun") {
        const p = 1 + Math.sin(t * 1.8) * 0.03 * amp;
        ctx.scale(p, p);
      } else if (motion === "moon") {
        ctx.translate(0, Math.sin(t * 1.15) * 8 * amp);
      } else if (motion === "water") {
        ctx.translate(Math.sin(t * 1.6) * 3 * amp, Math.sin(t * 2.4) * 2 * amp);
      } else if (motion === "rain") {
        ctx.translate(0, (t * 18 * amp) % 8);
      } else if (motion === "mountain") {
        ctx.translate(0, Math.sin(t * 0.7) * 3 * amp);
      } else if (motion === "home") {
        const p = 1 + Math.sin(t * 1.4) * 0.015 * amp;
        ctx.scale(p, p);
      } else if (motion === "glow") {
        const p = 1 + Math.sin(t * 2.1) * 0.025 * amp;
        ctx.scale(p, p);
      } else if (motion === "dawn") {
        ctx.translate(0, Math.sin(t * 0.9) * 6 * amp - 4 * amp);
      } else {
        ctx.translate(0, Math.sin(t * 1.2) * 3 * amp);
      }

      ctx.translate(-SIZE / 2, -SIZE / 2);

      if (motion === "swim") {
        for (let y = 0; y < SIZE; y += 2) {
          const dx = Math.sin(y * 0.045 + t * 3.4) * 7 * amp;
          ctx.drawImage(sheet, 0, y, SIZE, 2, dx, y, SIZE, 2);
        }
      } else {
        ctx.drawImage(sheet, 0, 0);
      }
      ctx.restore();

      drawExtras(motion, t, amp, i);
    }

    function drawExtras(motion, t, amp, i) {
      ctx.save();
      ctx.fillStyle = "rgba(230,223,208,0.55)";
      ctx.strokeStyle = "rgba(230,223,208,0.28)";
      ctx.lineWidth = 1;

      if (motion === "gallop") {
        for (let k = 0; k < 12; k++) {
          const sp = specks[k];
          const x = SIZE * 0.72 - ((t * (70 + sp.s * 40) + sp.p * 40) % (SIZE * 0.7));
          const y = SIZE * 0.72 + Math.sin(t * 8 + sp.p) * 10 * amp + sp.y * 18;
          ctx.globalAlpha = 0.15 + 0.35 * amp * (1 - (x / SIZE));
          ctx.beginPath();
          ctx.arc(x, y, 1.2 * sp.s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "fire") {
        for (let k = 0; k < 16; k++) {
          const sp = specks[k];
          const y = SIZE * 0.78 - ((t * (40 + sp.s * 50) + sp.p * 30) % (SIZE * 0.55));
          const x = SIZE * 0.5 + Math.sin(y * 0.05 + sp.p) * 28 * amp;
          ctx.globalAlpha = 0.12 + 0.4 * amp * (y / SIZE);
          ctx.beginPath();
          ctx.arc(x, y, 1.1 * sp.s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "rain") {
        ctx.globalAlpha = 0.28 * amp + 0.12;
        for (let k = 0; k < 18; k++) {
          const sp = specks[k];
          const y = ((t * (90 + sp.s * 40) + sp.y * SIZE) % SIZE);
          const x = sp.x * SIZE;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 2, y + 10 + sp.s * 6);
          ctx.stroke();
        }
      }

      if (motion === "water") {
        ctx.globalAlpha = 0.2 * amp + 0.1;
        ctx.beginPath();
        for (let x = 40; x < SIZE - 40; x += 6) {
          const y = SIZE * 0.78 + Math.sin(x * 0.08 + t * 3) * 5 * amp;
          if (x === 40) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      if (motion === "sun") {
        ctx.translate(SIZE / 2, SIZE / 2);
        ctx.rotate(t * 0.25);
        ctx.globalAlpha = 0.16 * amp;
        for (let k = 0; k < 12; k++) {
          ctx.rotate(Math.PI / 6);
          ctx.beginPath();
          ctx.moveTo(0, 92);
          ctx.lineTo(0, 118 + Math.sin(t * 2 + k) * 8);
          ctx.stroke();
        }
      }

      if (motion === "tree") {
        ctx.globalAlpha = 0.3 * amp;
        for (let k = 0; k < 8; k++) {
          const sp = specks[k];
          const y = ((t * 22 * sp.s + sp.y * SIZE) % (SIZE * 0.5)) + SIZE * 0.2;
          const x = SIZE * 0.35 + sp.x * SIZE * 0.3 + Math.sin(t + sp.p) * 12;
          ctx.beginPath();
          ctx.ellipse(x, y, 2.2, 1.1, sp.p, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "home") {
        ctx.globalAlpha = 0.22 * amp;
        for (let k = 0; k < 7; k++) {
          const sp = specks[k];
          const y = SIZE * 0.28 - ((t * 16 + sp.p * 10) % 50);
          const x = SIZE * 0.5 + Math.sin(t * 1.2 + sp.p) * 8;
          ctx.beginPath();
          ctx.arc(x, y, 1.4 + sp.s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "cart") {
        ctx.globalAlpha = 0.2 * amp;
        for (let k = 0; k < 10; k++) {
          const sp = specks[k];
          const x = SIZE * 0.78 - ((t * 80 + sp.p * 20) % (SIZE * 0.6));
          const y = SIZE * 0.74 + sp.y * 12;
          ctx.beginPath();
          ctx.arc(x, y, 1.1, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "dawn") {
        ctx.globalAlpha = 0.12 + 0.18 * amp * (0.5 + 0.5 * Math.sin(t));
        ctx.beginPath();
        ctx.arc(SIZE / 2, SIZE * 0.42, 70 + Math.sin(t) * 8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function morphBetween(fromIdx, toIdx, duration) {
      stopIdle();
      cancelAnimationFrame(morphRaf);
      const paired = morphPairs[fromIdx] || matchClouds(pointClouds[fromIdx], pointClouds[toIdx]);
      const t0 = performance.now();
      return new Promise((resolve) => {
        const tick = (now) => {
          if (!current) return resolve();
          const t = Math.min(1, (now - t0) / duration);
          worldBlend = easeMorph(t);
          drawPoints(paired, t);
          if (t < 1) morphRaf = requestAnimationFrame(tick);
          else {
            worldBlend = 1;
            startIdle(toIdx);
            resolve();
          }
        };
        morphRaf = requestAnimationFrame(tick);
      });
    }

    async function prepareClouds(story) {
      pointClouds = [];
      bitmaps = [];
      morphPairs = [];
      glyphSheets = [];
      for (const form of story.forms) {
        const img = await rasterizeForm(form);
        bitmaps.push(img);
        pointClouds.push(samplePoints(img));
        const sheet = document.createElement("canvas");
        sheet.width = SIZE;
        sheet.height = SIZE;
        sheet.getContext("2d").putImageData(img, 0, 0);
        glyphSheets.push(sheet);
      }
      for (let i = 0; i < pointClouds.length - 1; i++) {
        morphPairs[i] = matchClouds(pointClouds[i], pointClouds[i + 1]);
      }
    }

    function typeText(text) {
      clearInterval(typing);
      lineEl.innerHTML = "";
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      let i = 0;
      return new Promise((resolve) => {
        typing = setInterval(() => {
          if (!current) {
            clearInterval(typing);
            resolve();
            return;
          }
          if (i >= text.length) {
            clearInterval(typing);
            typing = null;
            lineEl.textContent = text;
            resolve();
            return;
          }
          lineEl.textContent = text.slice(0, i + 1);
          lineEl.appendChild(cursor);
          i += 1;
        }, 26);
      });
    }

    function wait(ms) {
      return new Promise((resolve) => {
        autoTimer = setTimeout(resolve, ms);
      });
    }

    function setDots() {
      dotsEl.innerHTML = current.texts
        .map((_, i) => `<span class="dot${i === chapter ? " on" : ""}"></span>`)
        .join("");
    }

    async function showChapter(i, { morphFrom } = {}) {
      if (!current || i < 0 || i >= current.texts.length) return;
      chapter = i;
      chapterEl.textContent = `${String(i + 1).padStart(2, "0")} / ${String(current.texts.length).padStart(2, "0")}`;
      setDots();
      eraEl.textContent = ERAS[i];
      eraEl.classList.remove("show");
      requestAnimationFrame(() => eraEl.classList.add("show"));
      if (morphFrom != null) {
        worldFrom = morphFrom;
        worldTo = i;
        worldBlend = 0;
        await morphBetween(morphFrom, i, MORPH_MS);
      } else {
        worldFrom = i;
        worldTo = i;
        worldBlend = 1;
        startIdle(i);
      }
      await typeText(current.texts[i]);
    }

    async function autoPlay() {
      const token = ++playToken;
      autoPlaying = true;
      hintTap.textContent = "演化中…";
      hintTap.classList.add("show");
      ctx.clearRect(0, 0, SIZE, SIZE);
      await prepareClouds(current);
      if (token !== playToken) return;

      await showChapter(0);
      if (token !== playToken) return;

      for (let i = 1; i < current.texts.length; i++) {
        await wait(1200);
        if (token !== playToken) return;
        await showChapter(i, { morphFrom: i - 1 });
        if (token !== playToken) return;
      }

      autoPlaying = false;
      hintTap.textContent = "轻触返回";
    }

    function openStory(id) {
      current = STORIES.find((s) => s.id === id);
      if (!current) return;
      gallery.classList.add("hidden");
      storyEl.classList.remove("hidden");
      startWorld(0);
      autoPlay();
    }

    function closeStory() {
      playToken += 1;
      autoPlaying = false;
      clearInterval(typing);
      typing = null;
      clearTimeout(autoTimer);
      cancelAnimationFrame(morphRaf);
      stopIdle();
      stopWorld();
      hintTap.classList.remove("show");
      ctx.clearRect(0, 0, SIZE, SIZE);
      pointClouds = [];
      bitmaps = [];
      morphPairs = [];
      glyphSheets = [];
      current = null;
      storyEl.classList.add("hidden");
      gallery.classList.remove("hidden");
    }

    function onStoryTap() {
      if (!current) return;
      if (autoPlaying) return;
      closeStory();
    }

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest(".card");
      if (btn) openStory(btn.dataset.id);
    });

    tap.addEventListener("click", onStoryTap);
    document.querySelector(".story-copy").addEventListener("click", onStoryTap);
    document.getElementById("btnBack").addEventListener("click", closeStory);
    document.getElementById("btnSkip").addEventListener("click", closeStory);
    window.addEventListener("resize", () => {
      if (document.body.classList.contains("film")) resizeWorld();
    });
    document.addEventListener("keydown", (e) => {
      if (storyEl.classList.contains("hidden")) return;
      if (e.key === "Escape") closeStory();
    });

    fetch("./glyphs.json")
      .then((r) => r.json())
      .then((data) => {
        ERAS = data.ERAS;
        STORIES = data.STORIES;
        renderGallery();
      })
      .catch((err) => {
        console.error(err);
        grid.innerHTML = `<p style="grid-column:1/-1;color:#8f8778;text-align:center;letter-spacing:0.12em">无法加载 glyphs.json</p>`;
      });
  </script>
</body>
</html>
