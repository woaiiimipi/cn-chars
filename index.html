<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />
  <title>字迹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0d0b;
      --fg: #e6dfd0;
      --muted: #8f8778;
      --soft: #3a362e;
      --jade: #7a9a84;
      --ember: #c9845a;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Noto Serif SC", serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      max-width: 480px;
      margin: 0 auto;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 45% at 50% -5%, rgba(122, 154, 132, 0.1), transparent 55%),
        radial-gradient(ellipse 70% 35% at 80% 100%, rgba(201, 132, 90, 0.06), transparent 50%);
      z-index: 0;
    }

    .screen {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(1.25rem + var(--safe-t)) 1.25rem calc(1.25rem + var(--safe-b));
    }

    .hidden { display: none !important; }

    .brand {
      font-size: 0.72rem;
      letter-spacing: 0.42em;
      color: var(--jade);
      margin-bottom: 1rem;
    }

    .title {
      font-weight: 300;
      font-size: 2.15rem;
      letter-spacing: 0.22em;
      line-height: 1.25;
    }

    .sub {
      margin-top: 0.7rem;
      font-weight: 300;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.7;
      letter-spacing: 0.08em;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      align-content: start;
      padding: 1.1rem 0 0.4rem;
      overflow-y: auto;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .intro-meta {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 1.15rem;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
    }

    .intro-meta span {
      border: 1px solid rgba(122, 154, 132, 0.25);
      border-radius: 999px;
      padding: 0.3rem 0.55rem;
      background: rgba(122, 154, 132, 0.06);
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 7.8rem;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 5rem;
      height: 5rem;
      right: -2.6rem;
      bottom: -2.6rem;
      border: 1px solid rgba(201, 132, 90, 0.18);
      border-radius: 50%;
    }

    .card .meaning {
      display: block;
      margin-top: 0.28rem;
      font-size: 0.62rem;
      color: rgba(230, 223, 208, 0.42);
      letter-spacing: 0.08em;
    }

    .card {
      appearance: none;
      border: 1px solid rgba(230, 223, 208, 0.1);
      background: linear-gradient(165deg, rgba(28, 26, 22, 0.95), rgba(14, 13, 11, 0.5));
      color: var(--fg);
      border-radius: 2px;
      padding: 1.05rem 0.75rem 0.95rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s;
    }

    .card:active { transform: scale(0.97); }
    .card:hover, .card:focus-visible {
      border-color: rgba(122, 154, 132, 0.45);
      outline: none;
    }

    .card .g {
      display: block;
      font-size: 2.15rem;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 0.55rem;
    }

    .card .m {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      color: var(--muted);
    }

    .foot-hint {
      flex-shrink: 0;
      font-size: 0.72rem;
      color: var(--soft);
      letter-spacing: 0.16em;
      text-align: center;
    }

    body.film {
      max-width: none;
      background: #000;
    }

    body.film::before { opacity: 0; }

    .story {
      position: fixed;
      inset: 0;
      height: 100dvh;
      display: block;
      padding: 0;
      overflow: hidden;
      background: #000;
      opacity: 0;
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .story.ready { opacity: 1; }

    .world {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: #0d1114;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, transparent 30%, rgba(0,0,0,0.55) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 18%, transparent 72%, rgba(0,0,0,0.72) 100%);
    }

    .grain {
      position: absolute;
      inset: -20%;
      z-index: 7;
      pointer-events: none;
      opacity: 0.14;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grainShift 0.85s steps(4) infinite;
    }

    .letterbox {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 5;
      background: #000;
      pointer-events: none;
    }

    .letterbox.top {
      top: 0;
      height: calc(7.6vh + var(--safe-t));
      min-height: calc(48px + var(--safe-t));
    }

    .letterbox.bot {
      bottom: 0;
      height: calc(26vh + var(--safe-b));
      min-height: calc(168px + var(--safe-b));
    }

    .story-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(7.6vh + var(--safe-t));
      min-height: calc(48px + var(--safe-t));
      padding: var(--safe-t) 1.15rem 0;
      opacity: 0.7;
    }

    .story-actions {
      display: flex;
      align-items: center;
      gap: 0.18rem;
    }

    .cold-open {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(1.035);
      background: radial-gradient(circle at 50% 46%, rgba(16, 18, 19, 0.34), rgba(0, 0, 0, 0.78) 72%);
      transition: opacity 0.65s ease, transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cold-open.show {
      opacity: 1;
      transform: scale(1);
    }

    .cold-index {
      margin-bottom: 1.1rem;
      color: rgba(201, 132, 90, 0.78);
      font-size: 0.66rem;
      letter-spacing: 0.42em;
    }

    .cold-hook {
      max-width: 13em;
      color: rgba(244, 238, 226, 0.96);
      font-size: clamp(1.55rem, 5.6vw, 2.45rem);
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: 0.08em;
      text-wrap: balance;
      text-shadow: 0 8px 42px rgba(0, 0, 0, 0.72);
    }

    .cold-line {
      width: 0;
      height: 1px;
      margin-top: 1.55rem;
      background: linear-gradient(90deg, transparent, var(--ember), transparent);
      transition: width 1.5s 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cold-open.show .cold-line { width: min(13rem, 54vw); }

    .icon-btn {
      appearance: none;
      border: 1px solid rgba(230, 223, 208, 0.12);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.18);
      color: rgba(230, 223, 208, 0.68);
      font: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      padding: 0.38rem 0.62rem;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .icon-btn:hover, .icon-btn:focus-visible, .icon-btn.active {
      color: var(--fg);
      border-color: rgba(122, 154, 132, 0.7);
      background: rgba(122, 154, 132, 0.14);
      outline: none;
    }

    .stage {
      position: absolute;
      top: calc(7.6vh + var(--safe-t));
      bottom: calc(26vh + var(--safe-b));
      left: 0;
      right: 0;
      z-index: 3;
      margin: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glyph-frame canvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.45));
      transition: filter 0.7s ease;
    }

    .glyph-frame {
      transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .glyph-frame.morphing { transform: scale(1.018); }
    .glyph-frame.morphing canvas {
      filter: blur(0.35px) drop-shadow(0 18px 52px rgba(0,0,0,0.52));
    }

    .story[data-beat="mystery"] .glyph-frame { transform: scale(0.92); }
    .story[data-beat="rise"] .glyph-frame { transform: scale(0.99); }
    .story[data-beat="turn"] .glyph-frame { transform: scale(1.025); }
    .story[data-beat="impact"] .glyph-frame { transform: scale(1.07); }
    .story[data-beat="resolve"] .glyph-frame { transform: scale(0.98); }

    .story-copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(5.6vh + var(--safe-b));
      z-index: 6;
      flex-shrink: 0;
      padding: 0.2rem 1.7rem 0;
      min-height: 0;
      text-align: center;
      transition: opacity 0.42s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), filter 0.42s ease;
      will-change: opacity, transform, filter;
    }

    .story-copy.changing {
      opacity: 0;
      transform: translateY(8px);
      filter: blur(3px);
    }

    .era {
      font-size: 0.68rem;
      letter-spacing: 0.42em;
      color: rgba(232, 210, 170, 0.7);
      margin-bottom: 0.55rem;
      text-shadow: 0 2px 18px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.45s, transform 0.45s;
    }

    .era.show { opacity: 1; transform: none; }

    .line {
      font-weight: 300;
      font-size: 0.98rem;
      line-height: 1.9;
      letter-spacing: 0.08em;
      min-height: 3.4em;
      color: rgba(236, 228, 214, 0.92);
      text-shadow: 0 2px 16px rgba(0,0,0,0.85);
    }

    .line .cursor {
      display: inline-block;
      width: 0.45em;
      height: 0.95em;
      margin-left: 2px;
      background: var(--jade);
      vertical-align: -0.08em;
      animation: blink 1s steps(1) infinite;
    }

    .line .char {
      display: inline;
      opacity: 0;
      filter: blur(2px);
      animation: revealChar 0.62s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(2.4vh + var(--safe-b));
      z-index: 6;
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      padding: 0;
      opacity: 0.45;
    }

    .progress {
      position: absolute;
      left: 1.2rem;
      right: 1.2rem;
      bottom: calc(8.2vh + var(--safe-b));
      z-index: 6;
      height: 2px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(230, 223, 208, 0.14);
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--jade), var(--ember));
      transition: width 0.35s ease;
    }

    .voice-state {
      position: absolute;
      right: 1.1rem;
      bottom: calc(1.1vh + var(--safe-b));
      z-index: 6;
      color: rgba(230, 223, 208, 0.35);
      font-size: 0.52rem;
      letter-spacing: 0.08em;
    }

    .recording .icon-btn.record { color: #ff9d75; border-color: rgba(255, 157, 117, 0.65); }
    .recording .icon-btn.record::before { content: "● "; }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--soft);
      transition: background 0.3s, transform 0.3s;
    }

    .dot.on {
      background: var(--jade);
      transform: scale(1.35);
    }

    .source {
      position: absolute;
      left: 1.1rem;
      bottom: calc(1.1vh + var(--safe-b));
      z-index: 6;
      font-size: 0.52rem;
      letter-spacing: 0.08em;
      color: rgba(143, 135, 120, 0.28);
      max-width: 42%;
      line-height: 1.4;
      pointer-events: none;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(-1%, 2%); }
      100% { transform: translate(0, 0); }
    }

    .back, .skip {
      appearance: none;
      background: none;
      border: none;
      color: rgba(230, 223, 208, 0.42);
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      padding: 0.5rem 0.2rem;
      cursor: pointer;
    }

    .chapter {
      font-size: 0.62rem;
      letter-spacing: 0.42em;
      color: rgba(232, 210, 170, 0.45);
    }

    .glyph-frame {
      position: relative;
      width: min(78vw, 320px);
      aspect-ratio: 1;
      max-height: min(48dvh, 360px);
    }

    .tap-zone {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
    }

    .hint-tap {
      margin-top: 0.55rem;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      color: rgba(143, 135, 120, 0.55);
      opacity: 0;
      transition: opacity 0.5s;
    }

    .hint-tap.show { opacity: 1; }

    @media (min-width: 720px) {
      body:not(.film) { max-width: 720px; }
      .screen { padding-left: 2.5rem; padding-right: 2.5rem; }
      .grid { grid-template-columns: repeat(4, 1fr); gap: 0.9rem; }
      .card { min-height: 8.3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes revealChar {
      from { opacity: 0; filter: blur(2px); }
      to { opacity: 1; filter: blur(0); }
    }
  </style>
</head>
<body>
  <section class="screen" id="gallery">
    <div>
      <p class="brand">字迹</p>
      <h1 class="title">每个字，都是一部电影</h1>
      <p class="sub">14 个汉字，14 场穿越三千年的命运转折。</p>
      <div class="intro-meta" aria-label="作品信息">
        <span id="storyCount">20 个字</span><span>5 个时代</span><span>MiMo 男声 · 原创配乐</span>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="foot-hint">甲骨 · 金文 · 小篆 · 隶书 · 简体</p>
  </section>

  <section class="story hidden" id="story">
    <canvas class="world" id="world" aria-hidden="true"></canvas>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="letterbox top"></div>
    <div class="letterbox bot"></div>
    <div class="story-bar">
      <button type="button" class="back" id="btnBack">返回</button>
      <span class="chapter" id="chapter">01 / 05</span>
      <div class="story-actions">
        <button type="button" class="icon-btn" id="btnPlay" aria-label="暂停播放">暂停</button>
        <button type="button" class="icon-btn active" id="btnSound" aria-label="关闭声音">声音</button>
        <button type="button" class="icon-btn record" id="btnRecord" aria-label="录制短视频">录制</button>
        <button type="button" class="skip" id="btnSkip">关闭</button>
      </div>
    </div>
    <div class="cold-open" id="coldOpen" aria-live="polite">
      <p class="cold-index" id="coldIndex">01 · 日</p>
      <p class="cold-hook" id="coldHook"></p>
      <span class="cold-line"></span>
    </div>
    <div class="stage" id="stage">
      <div class="glyph-frame" id="glyphFrame">
        <canvas id="glyphCanvas" width="360" height="360" aria-hidden="true"></canvas>
      </div>
      <div class="tap-zone" id="tap" aria-label="返回"></div>
    </div>
    <div class="story-copy">
      <div class="era" id="era"></div>
      <div class="line" id="line"></div>
      <div class="hint-tap" id="hintTap">演化中…</div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="progress" aria-label="播放进度"><span id="progressFill"></span></div>
    <p class="source">甲金篆：中大 / 中研院校勘 · 隶书：中研院篆隶库结构重绘 · ACC（PD/CC0）</p>
    <p class="voice-state" id="voiceState" aria-live="polite">声音已开启 · 真实古琴配乐 + MiMo「白桦」男声</p>
  </section>

  <script src="./glyphs.js"></script>

    function makeImpulse(ctx, seconds = 2.8, decay = 3.2) {
      const length = Math.floor(ctx.sampleRate * seconds);
      const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
      for (let channel = 0; channel < impulse.numberOfChannels; channel++) {
        const output = impulse.getChannelData(channel);
        for (let i = 0; i < length; i++) {
          const envelope = Math.pow(1 - i / length, decay);
          output[i] = (Math.random() * 2 - 1) * envelope;
        }
      }
      return impulse;
    }

    function playMusicNote(frequency, at, duration = 2.6, level = 0.055) {
      if (!audioCtx || !musicBus) return;
      const osc = audioCtx.createOscillator();
      const overtone = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      overtone.type = "sine";
      osc.frequency.setValueAtTime(frequency, at);
      overtone.frequency.setValueAtTime(frequency * 2.01, at);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1900, at);
      filter.frequency.exponentialRampToValueAtTime(420, at + duration);
      filter.Q.value = 0.7;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(level, at + 0.025);
      gain.gain.exponentialRampToValueAtTime(level * 0.32, at + 0.42);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
      osc.connect(filter);
      overtone.connect(filter);
      filter.connect(gain).connect(musicBus);
      osc.start(at);
      overtone.start(at);
      osc.stop(at + duration + 0.05);
      overtone.stop(at + duration + 0.05);
    }

    function scheduleMusic() {
      if (!audioCtx || !musicBus) return;
      const pentatonic = [293.66, 329.63, 392, 440, 523.25, 587.33];
      const phrases = [
        [0, 2, 3, 1, 4, 2],
        [2, 4, 5, 3, 1, 0],
        [0, 3, 2, 5, 4, 2],
        [4, 3, 1, 2, 0, 2],
      ];
      const phrase = phrases[musicPhrase % phrases.length];
      const start = audioCtx.currentTime + 0.08;
      phrase.forEach((note, index) => {
        const human = index % 2 ? 0.035 : 0;
        if (index % 2 === 0) playMusicNote(pentatonic[note], start + index * 1.5 + human, 2.8, index === 0 ? 0.018 : 0.011);
      });
      playMusicNote(pentatonic[phrase[0]] / 2, start, 7.8, 0.006);
      musicPhrase += 1;
      clearTimeout(musicTimer);
      musicTimer = setTimeout(scheduleMusic, 9000);
    }

    function ensureAudio() {
      if (audioCtx) {

      const compressor = audioCtx.createDynamicsCompressor();

      audioMaster.connect(compressor);
      compressor.connect(audioCtx.destination);
      compressor.connect(audioDestination);
      musicBus = audioCtx.createGain();
      musicBus.gain.value = 0.72;
      musicReverb = audioCtx.createConvolver();
      musicReverb.buffer = makeImpulse(audioCtx);
      const dry = audioCtx.createGain();
      const wet = audioCtx.createGain();
      dry.gain.value = 0.76;
      wet.gain.value = 0.34;
      musicBus.connect(dry).connect(audioMaster);
      musicBus.connect(musicReverb).connect(wet).connect(audioMaster);
      prepareAcousticInstruments();
      scheduleMusic();
      if (audioCtx.state === "suspended") audioCtx.resume();

      gain.gain.exponentialRampToValueAtTime(0.07, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain).connect(musicBus || audioMaster);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function fetchNarration(text, chapterIndex) {
      const key = narrationKey(text, chapterIndex);
      if (narrationCache.has(key)) return narrationCache.get(key);
      const pending = fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          voice: TTS_VOICE,
          direction: TTS_DIRECTIONS[chapterIndex] || TTS_DIRECTIONS[1],
        }),
      }).then(async (response) => {
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.error || `MiMo TTS ${response.status}`);
        }
        return response.arrayBuffer();
      }).catch((error) => {
        narrationCache.delete(key);
        throw error;
      });
      narrationCache.set(key, pending);
      return pending;
    }

      renderRecordingFrame();
      const tracks = [...recordCanvas.captureStream(30).getVideoTracks()];
      if (audioDestination) tracks.push(...audioDestination.stream.getAudioTracks());
      const stream = new MediaStream(tracks);
      const formats = [
        { mime: "video/mp4;codecs=avc1.42E01E,mp4a.40.2", extension: "mp4", label: "MP4" },
        { mime: "video/mp4;codecs=avc1,mp4a.40.2", extension: "mp4", label: "MP4" },
        { mime: "video/mp4", extension: "mp4", label: "MP4" },
        { mime: "video/webm;codecs=vp9,opus", extension: "webm", label: "WebM" },
        { mime: "video/webm;codecs=vp8,opus", extension: "webm", label: "WebM" },
        { mime: "video/webm", extension: "webm", label: "WebM" },
      ];
      const format = formats.find((item) => MediaRecorder.isTypeSupported(item.mime)) || formats.at(-1);
      const mime = format.mime;
      recording = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6500000 });
      recordedChunks = [];
      recording.ondataavailable = (event) => { if (event.data.size) recordedChunks.push(event.data); };
      recording.onstop = () => {
        const blob = new Blob(recordedChunks, { type: mime });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `字迹-${current?.glyph || "短片"}-${new Date().toISOString().slice(0, 10)}.${format.extension}`;

    function coverRect(sourceWidth, sourceHeight, targetWidth, targetHeight) {
      const scale = Math.max(targetWidth / sourceWidth, targetHeight / sourceHeight);
      const width = sourceWidth * scale;
      const height = sourceHeight * scale;
      return { x: (targetWidth - width) / 2, y: (targetHeight - height) / 2, width, height };
    }

    function wrapCanvasText(context, text, maxWidth) {
      const lines = [];
      let line = "";
      for (const character of text || "") {
        const next = line + character;
        if (context.measureText(next).width > maxWidth && line) {
          lines.push(line);
          line = character;
        } else {
          line = next;
        }
      }
      if (line) lines.push(line);
      return lines.slice(0, 3);
    }

    function renderRecordingFrame() {
      const rw = recordCanvas.width;
      const rh = recordCanvas.height;
      recordCtx.setTransform(1, 0, 0, 1, 0, 0);
      recordCtx.fillStyle = "#08090a";
      recordCtx.fillRect(0, 0, rw, rh);
      if (worldEl.width && worldEl.height) {
        const rect = coverRect(worldEl.width, worldEl.height, rw, rh);
        recordCtx.drawImage(worldEl, rect.x, rect.y, rect.width, rect.height);
      }
      const shade = recordCtx.createLinearGradient(0, 0, 0, rh);
      shade.addColorStop(0, "rgba(0,0,0,.36)");
      shade.addColorStop(0.22, "rgba(0,0,0,0)");
      shade.addColorStop(0.64, "rgba(0,0,0,.08)");
      shade.addColorStop(1, "rgba(0,0,0,.88)");
      recordCtx.fillStyle = shade;
      recordCtx.fillRect(0, 0, rw, rh);
      if (coldOpen.classList.contains("show")) {
        recordCtx.fillStyle = "rgba(0,0,0,.54)";
        recordCtx.fillRect(0, 0, rw, rh);
        recordCtx.textAlign = "center";
        recordCtx.fillStyle = "rgba(201,132,90,.86)";
        recordCtx.font = '500 22px "Noto Serif SC", serif';
        recordCtx.fillText(coldIndex.textContent, rw / 2, 500);
        recordCtx.fillStyle = "rgba(246,240,228,.97)";
        recordCtx.font = '500 40px "Noto Serif SC", serif';
        const hookLines = wrapCanvasText(recordCtx, coldHook.textContent, 560);
        hookLines.forEach((line, index) => recordCtx.fillText(line, rw / 2, 590 + index * 68));
        const lineWidth = 220;
        const hookRule = recordCtx.createLinearGradient(rw / 2 - lineWidth / 2, 0, rw / 2 + lineWidth / 2, 0);
        hookRule.addColorStop(0, "rgba(201,132,90,0)");
        hookRule.addColorStop(0.5, "rgba(201,132,90,.9)");
        hookRule.addColorStop(1, "rgba(201,132,90,0)");
        recordCtx.fillStyle = hookRule;
        recordCtx.fillRect(rw / 2 - lineWidth / 2, 780, lineWidth, 2);
        return;
      }
      recordCtx.save();
      recordCtx.shadowColor = "rgba(0,0,0,.48)";
      recordCtx.shadowBlur = 36;
      recordCtx.drawImage(canvas, 90, 220, 540, 540);
      recordCtx.restore();
      recordCtx.textAlign = "center";
      recordCtx.fillStyle = "rgba(232,210,170,.78)";
      recordCtx.font = '500 24px "Noto Serif SC", serif';
      recordCtx.fillText(eraEl.textContent || "字迹", rw / 2, 875);
      recordCtx.fillStyle = "rgba(240,234,222,.94)";
      recordCtx.font = '300 30px "Noto Serif SC", serif';
      const lines = wrapCanvasText(recordCtx, lineEl.textContent, 600);
      lines.forEach((line, index) => recordCtx.fillText(line, rw / 2, 940 + index * 52));
      recordCtx.fillStyle = "rgba(122,154,132,.7)";
      recordCtx.fillRect(70, 1148, 580 * ((chapter + 1) / Math.max(1, current?.texts.length || 5)), 3);
      recordCtx.fillStyle = "rgba(230,223,208,.16)";
      recordCtx.fillRect(70 + 580 * ((chapter + 1) / Math.max(1, current?.texts.length || 5)), 1148, 580 * (1 - ((chapter + 1) / Math.max(1, current?.texts.length || 5))), 3);
      recordCtx.fillStyle = "rgba(230,223,208,.48)";
      recordCtx.font = '300 17px "Noto Serif SC", serif';
      recordCtx.fillText(`字迹 · ${current?.glyph || "一画开天"} · ${String(chapter + 1).padStart(2, "0")} / 05`, rw / 2, 1205);
    }

    function mix3(a, b, t) {
      return [
        a[0] + (b[0] - a[0]) * t,
        a[1] + (b[1] - a[1]) * t,
        a[2] + (b[2] - a[2]) * t,
      ];
    }

    function mixWorld(a, b, t) {
      return {
        top: mix3(a.top, b.top, t),
        mid: mix3(a.mid, b.mid, t),
        bot: mix3(a.bot, b.bot, t),
        haze: mix3(a.haze, b.haze, t),
        disc: mix3(a.disc, b.disc, t),
        weather: t < 0.5 ? a.weather : b.weather,
        weatherFrom: a.weather,
        weatherTo: b.weather,
        horizon: a.horizon + (b.horizon - a.horizon) * t,
        discY: a.discY + (b.discY - a.discY) * t,
        wind: a.wind + (b.wind - a.wind) * t,
        blend: t,
      };
    }

    function applyAtmosphere(scene, motion) {
      const atmosphere = ATMOSPHERES[motion];
      if (!atmosphere) return scene;
      const strength = atmosphere.strength ?? 0.55;
      scene.top = mix3(scene.top, atmosphere.top, strength);
      scene.mid = mix3(scene.mid, atmosphere.mid, strength);
      scene.bot = mix3(scene.bot, atmosphere.bot, strength);
      scene.haze = mix3(scene.haze, atmosphere.haze, strength);
      scene.disc = mix3(scene.disc, atmosphere.disc, strength);
      scene.wind = scene.wind * 0.35 + atmosphere.wind * 0.65;
      scene.horizon = scene.horizon * 0.45 + atmosphere.horizon * 0.55;
      if (atmosphere.weather) {
        scene.weather = atmosphere.weather;
        scene.weatherFrom = atmosphere.weather;
        scene.weatherTo = atmosphere.weather;
        scene.blend = 0;
      }
      return scene;
    }

    function rgb(c, a) {
      return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
    }

    function resizeWorld() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = window.innerWidth;
      const h = window.innerHeight;
      worldEl.width = Math.max(1, Math.floor(w * dpr));
      worldEl.height = Math.max(1, Math.floor(h * dpr));
      worldEl.style.width = w + "px";
      worldEl.style.height = h + "px";
      wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function startWorld(i) {
      document.body.classList.add("film");
      worldFrom = i;
      worldTo = i;
      worldBlend = 1;
      resizeWorld();
      worldT0 = performance.now();
      cancelAnimationFrame(worldRaf);
      const tick = (now) => {
        if (!current) return;
        paintWorld((now - worldT0) / 1000);
        worldRaf = requestAnimationFrame(tick);
      };
      worldRaf = requestAnimationFrame(tick);
    }

    function stopWorld() {
      cancelAnimationFrame(worldRaf);
      worldRaf = 0;
      document.body.classList.remove("film");
    }

    function weatherMix(scene, kind) {
      let amount = 0;
      if (scene.weatherFrom === kind) amount += 1 - scene.blend;
      if (scene.weatherTo === kind) amount += scene.blend;
      return Math.max(0, Math.min(1, amount));
    }

    function paintWorld(t) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const motion = current && current.motion;
      const scene = applyAtmosphere(mixWorld(
        WORLDS[worldFrom] || WORLDS[0],
        WORLDS[worldTo] || WORLDS[0],
        worldBlend
      ), motion);
      beatEnergy += (beatTarget - beatEnergy) * 0.025;
      impactFlash *= 0.93;
      const kenX = Math.sin(t * (0.052 + beatEnergy * 0.025)) * (7 + beatEnergy * 8);
      const kenY = Math.cos(t * (0.044 + beatEnergy * 0.018)) * (4 + beatEnergy * 5);
      const kenZ = 1.06 + beatEnergy * 0.018 + Math.sin(t * 0.045) * (0.008 + beatEnergy * 0.01);

      wctx.setTransform(1, 0, 0, 1, 0, 0);
      wctx.globalAlpha = 1;
      wctx.clearRect(0, 0, worldEl.width, worldEl.height);
      wctx.fillStyle = rgb(scene.top, 1);
      wctx.fillRect(0, 0, worldEl.width, worldEl.height);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      wctx.save();
      wctx.translate(w / 2, h / 2);
      wctx.scale(kenZ, kenZ);
      wctx.translate(-w / 2 + kenX, -h / 2 + kenY);

      const sky = wctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, rgb(scene.top, 1));
      sky.addColorStop(0.42, rgb(scene.mid, 1));
      sky.addColorStop(scene.horizon, rgb(mix3(scene.mid, scene.bot, 0.35), 1));
      sky.addColorStop(1, rgb(scene.bot, 1));
      wctx.fillStyle = sky;
      const overscan = 140;
      wctx.fillRect(-overscan, -overscan, w + overscan * 2, h + overscan * 2);

      drawSkyDisc(w, h, t, scene, motion);
      drawClouds(w, h, t, scene);
      if (motion === "mountain") drawRidges(w, h, scene, t);
      const rainAmount = weatherMix(scene, "rain");
      if (motion === "water" || rainAmount > 0.01) {
        drawWaterline(w, h, t, scene, motion === "water" ? 1 : rainAmount * 0.45);
      }

      wctx.restore();

      drawWeather(w, h, t, scene, motion);
      if (motion === "fire" && scene.weather !== "ember") {
        paintWeatherKind("ember", 0.4, w, h, t, scene, motion);
      }
      if (motion === "rain" && scene.weather !== "rain") {
        paintWeatherKind("rain", 0.5, w, h, t, scene, motion);
      }
      if (motion === "gallop" && scene.weather !== "sand") {
        paintWeatherKind("sand", 0.28, w, h, t, scene, motion);
      }
      drawInkTransition(w, h, t, scene);

      const bloom = wctx.createRadialGradient(w * 0.5, h * 0.42, 20, w * 0.5, h * 0.42, Math.max(w, h) * 0.42);
      bloom.addColorStop(0, rgb(scene.haze, 0.11 + beatEnergy * 0.09));
      bloom.addColorStop(0.45, rgb(scene.haze, 0.05));
      bloom.addColorStop(1, "rgba(0,0,0,0)");
      wctx.fillStyle = bloom;
      wctx.fillRect(0, 0, w, h);

      const emberAmount = weatherMix(scene, "ember");
      if (emberAmount > 0.01) {
        wctx.fillStyle = `rgba(255,120,40,${emberAmount * (0.018 + 0.026 * Math.abs(Math.sin(t * 5)))})`;
        wctx.fillRect(0, 0, w, h);
      }
      if (impactFlash > 0.004) {
        const flash = wctx.createRadialGradient(w * 0.5, h * 0.42, 0, w * 0.5, h * 0.42, Math.max(w, h) * 0.64);
        flash.addColorStop(0, `rgba(244,226,190,${impactFlash})`);
        flash.addColorStop(0.34, `rgba(201,132,90,${impactFlash * 0.38})`);
        flash.addColorStop(1, "rgba(0,0,0,0)");
        wctx.fillStyle = flash;
        wctx.fillRect(0, 0, w, h);
      }
      if (recording) renderRecordingFrame();
    }

    function drawInkTransition(w, h, t, scene) {
      if (worldFrom === worldTo) return;
      const energy = Math.sin(Math.PI * Math.max(0, Math.min(1, worldBlend)));
      if (energy < 0.015) return;
      wctx.save();
      wctx.globalCompositeOperation = "multiply";
      for (let i = 0; i < 7; i++) {
        const bit = weatherBits[i + 12];
        const drift = Math.sin(t * 0.32 + bit.p) * 32;
        const x = w * (0.08 + bit.x * 0.84) + drift;
        const y = h * (0.12 + bit.y * 0.66);
        const radius = Math.max(w, h) * (0.16 + bit.z * 0.16) * (0.7 + energy * 0.55);
        const ink = wctx.createRadialGradient(x, y, radius * 0.08, x, y, radius);
        ink.addColorStop(0, rgb(mix3(scene.bot, [4, 5, 6], 0.65), 0.22 * energy));
        ink.addColorStop(0.46, rgb(scene.bot, 0.11 * energy));
        ink.addColorStop(1, "rgba(0,0,0,0)");
        wctx.fillStyle = ink;
        wctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
      }
      wctx.globalCompositeOperation = "screen";
      const glow = wctx.createRadialGradient(w * 0.5, h * 0.44, 0, w * 0.5, h * 0.44, Math.max(w, h) * 0.48);
      glow.addColorStop(0, rgb(scene.haze, 0.08 * energy));
      glow.addColorStop(1, "rgba(0,0,0,0)");
      wctx.fillStyle = glow;
      wctx.fillRect(0, 0, w, h);
      wctx.restore();
    }

    function drawSkyDisc(w, h, t, scene, motion) {
      const isMoon = motion === "moon";
      const rainAmount = weatherMix(scene, "rain");
      const visibility = motion === "sun" ? 1 : 1 - rainAmount * 0.92;
      if (visibility < 0.02) return;
      wctx.save();
      wctx.globalAlpha = visibility;
      const cx = w * (0.62 + Math.sin(t * 0.05) * 0.04);
      const cy = h * scene.discY;
      const r = (motion === "sun" ? 0.11 : 0.08) * Math.min(w, h);
      const pulse = 1 + Math.sin(t * 1.4) * 0.04;
      const g = wctx.createRadialGradient(cx, cy, 0, cx, cy, r * 3.2 * pulse);
      g.addColorStop(0, rgb(scene.disc, isMoon ? 0.55 : 0.42));
      g.addColorStop(0.28, rgb(scene.disc, 0.16));
      g.addColorStop(1, "rgba(0,0,0,0)");
      wctx.fillStyle = g;
      wctx.beginPath();
      wctx.arc(cx, cy, r * 3.2 * pulse, 0, Math.PI * 2);
      wctx.fill();
      wctx.fillStyle = rgb(scene.disc, isMoon ? 0.78 : 0.55);
      wctx.beginPath();
      wctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
      wctx.fill();
      if (isMoon) {
        wctx.fillStyle = rgb(scene.top, 1);
        wctx.beginPath();
        wctx.arc(cx + r * 0.38, cy - r * 0.16, r * 0.86, 0, Math.PI * 2);
        wctx.fill();
        wctx.fillStyle = rgb(scene.haze, 0.22);
        for (let i = 8; i < 22; i++) {
          const b = weatherBits[i];
          wctx.globalAlpha = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.3 + b.p));
          wctx.beginPath();
          wctx.arc(b.x * w * 0.9 + 20, b.y * h * 0.38 + 20, 0.7 + b.s * 0.6, 0, Math.PI * 2);
          wctx.fill();
        }
        wctx.globalAlpha = 1;
      }
      wctx.restore();
    }

    function drawClouds(w, h, t, scene) {
      wctx.fillStyle = rgb(scene.haze, 0.07);
      for (let i = 0; i < 5; i++) {
        const b = weatherBits[i];
        const x = ((b.x * w + Math.sin(t * 0.12 + b.p) * 40 + t * 8 * scene.wind * b.z) % (w + 220)) - 110;
        const y = h * (0.16 + b.y * 0.22);
        wctx.beginPath();
        wctx.ellipse(x, y, 90 * b.z + 40, 18 * b.z + 10, 0, 0, Math.PI * 2);
        wctx.fill();
      }
    }

    function drawRidges(w, h, scene, t) {
      const hy = h * scene.horizon;
      wctx.beginPath();
      wctx.moveTo(-20, h + 20);
      wctx.lineTo(-20, hy);
      for (let x = 0; x <= w + 20; x += 18) {
        const y = hy - 28 - Math.abs(Math.sin(x * 0.012 + t * 0.05)) * 52 - Math.sin(x * 0.03) * 12;
        wctx.lineTo(x, y);
      }
      wctx.lineTo(w + 20, h + 20);
      wctx.closePath();
      wctx.fillStyle = rgb(mix3(scene.bot, scene.mid, 0.25), 0.85);
      wctx.fill();
    }

    function drawWaterline(w, h, t, scene, amp) {
      const y0 = h * (scene.horizon + 0.04);
      wctx.beginPath();
      wctx.moveTo(-20, h + 20);
      wctx.lineTo(-20, y0);
      for (let x = 0; x <= w + 20; x += 10) {
        wctx.lineTo(x, y0 + Math.sin(x * 0.03 + t * 2.2) * 6 * amp);
      }
      wctx.lineTo(w + 20, h + 20);
      wctx.closePath();
      wctx.fillStyle = rgb(mix3(scene.bot, scene.haze, 0.25), 0.55);
      wctx.fill();
    }

    function drawWeather(w, h, t, scene, motion) {
      const aFrom = 1 - scene.blend;
      const aTo = scene.blend;
      paintWeatherKind(scene.weatherFrom, aFrom, w, h, t, scene, motion);
      if (scene.weatherTo !== scene.weatherFrom) {
        paintWeatherKind(scene.weatherTo, aTo, w, h, t, scene, motion);
      }
    }

    function paintWeatherKind(kind, alpha, w, h, t, scene, motion) {
      if (alpha < 0.02) return;
      const boostRain = motion === "rain" ? 1.6 : 1;
      const boostEmber = motion === "fire" ? 1.5 : 1;
      const boostSand = motion === "gallop" || motion === "cart" ? 1.4 : 1;
      wctx.save();
      if (kind === "sand") {
        wctx.strokeStyle = rgb(scene.haze, 0.18 * alpha * boostSand);
        wctx.lineWidth = 1;
        for (let i = 0; i < 70; i++) {
          const b = weatherBits[i];
          const x = ((b.x * w + t * (90 + b.s * 80) * scene.wind) % (w + 40)) - 20;
          const y = ((b.y * h + Math.sin(t * 0.8 + b.p) * 12) % h);
          wctx.globalAlpha = (0.15 + b.z * 0.35) * alpha;
          wctx.beginPath();
          wctx.moveTo(x, y);
          wctx.lineTo(x - 14 * b.s * scene.wind, y + 1);
          wctx.stroke();
        }
      } else if (kind === "ember") {
        for (let i = 0; i < 64; i++) {
          const b = weatherBits[i];
          const y = h - ((t * (40 + b.s * 70) * boostEmber + b.y * h) % (h * 0.9));
          const x = b.x * w + Math.sin(y * 0.02 + b.p) * 18;
          wctx.fillStyle = rgb(scene.disc, (0.12 + b.z * 0.4) * alpha * boostEmber);
          wctx.beginPath();
          wctx.arc(x, y, 1.1 * b.s, 0, Math.PI * 2);
          wctx.fill();
        }
      } else if (kind === "ash") {
        for (let i = 0; i < 50; i++) {
          const b = weatherBits[i];
          const y = ((t * (12 + b.s * 18) + b.y * h) % h);
          const x = b.x * w + Math.sin(t * 0.4 + b.p) * 22;
          wctx.fillStyle = rgb(scene.haze, (0.08 + b.z * 0.22) * alpha);
          wctx.beginPath();
          wctx.ellipse(x, y, 2.4 * b.s, 1.1, b.p, 0, Math.PI * 2);
          wctx.fill();
        }
      } else if (kind === "rain") {
        wctx.strokeStyle = rgb(scene.haze, 0.22 * alpha * boostRain);
        wctx.lineWidth = 1.1;
        for (let i = 0; i < 80; i++) {
          const b = weatherBits[i];
          const y = ((t * (220 + b.s * 140) * boostRain + b.y * h) % (h + 30)) - 15;
          const x = b.x * w + t * 18 * scene.wind;
          wctx.globalAlpha = (0.18 + b.z * 0.35) * alpha * boostRain;
          wctx.beginPath();
          wctx.moveTo(x, y);
          wctx.lineTo(x - 4, y + 16 + b.s * 10);
          wctx.stroke();
        }
      } else {
        for (let i = 0; i < 36; i++) {
          const b = weatherBits[i];
          const x = b.x * w + Math.sin(t * 0.25 + b.p) * 30;
          const y = b.y * h + Math.cos(t * 0.18 + b.p) * 16;
          wctx.fillStyle = rgb(scene.haze, (0.05 + b.z * 0.12) * alpha);
          wctx.beginPath();
          wctx.arc(x, y, 18 * b.z, 0, Math.PI * 2);
          wctx.fill();
        }
      }
      wctx.restore();
    }

    function easeInOutQuint(t) {
      return t < 0.5
        ? 16 * t * t * t * t * t
        : 1 - Math.pow(-2 * t + 2, 5) / 2;
    }

    function renderGallery() {
      grid.innerHTML = STORIES.map(
        (s) => `<button type="button" class="card" data-id="${s.id}">
          <span class="g">${s.glyph}</span>
          <span class="m">${s.meaning}</span>
          <span class="meaning">${s.hook || s.texts?.[0]?.slice(0, 18) || "观看字形演化"}</span>
        </button>`
      ).join("");
    }

    function parseViewBox(vb) {
      const p = (vb || "0 0 300 300").trim().split(/[\s,]+/).map(Number);
      return { x: p[0] || 0, y: p[1] || 0, w: p[2] || 300, h: p[3] || 300 };
    }

    async function rasterizeForm(form) {
      fontsReady = fontsReady || document.fonts.ready;
      await fontsReady;
      const off = document.createElement("canvas");
      off.width = SIZE;
      off.height = SIZE;
      const octx = off.getContext("2d", { willReadFrequently: true });
      octx.clearRect(0, 0, SIZE, SIZE);

      const textMatch = form.body && form.body.match(/<text\b[^>]*>([^<]*)<\/text>/i);
      if (form.asset) {
        const img = await loadImage(form.asset);
        octx.drawImage(img, 0, 0, SIZE, SIZE);
      } else if (textMatch) {
        const ch = textMatch[1];
        const isClerical = /scale\(1\.08/.test(form.body);
        octx.fillStyle = "#e6dfd0";
        octx.textAlign = "center";
        octx.textBaseline = "middle";
        octx.font = `500 ${isClerical ? 200 : 216}px "Noto Serif SC", serif`;
        if (isClerical) {
          octx.save();
          octx.translate(SIZE / 2, SIZE / 2 + 6);
          octx.scale(1.08, 0.92);
          octx.fillText(ch, 0, 0);
          octx.restore();
        } else {
          octx.fillText(ch, SIZE / 2, SIZE / 2 + 8);
        }
      } else {
        const vb = parseViewBox(form.viewBox);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" width="${SIZE}" height="${SIZE}">${form.body}</svg>`;
        const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
        try {
          const img = await loadImage(url);
          octx.drawImage(img, 0, 0, SIZE, SIZE);
        } finally {
          URL.revokeObjectURL(url);
        }
      }
      const img = octx.getImageData(0, 0, SIZE, SIZE);
      inkOnly(img);
      return img;
    }

    function inkOnly(imageData) {
      const data = imageData.data;
      const r = INK[0];
      const g = INK[1];
      const b = INK[2];
      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3];
        if (!a) {
          data[i] = data[i + 1] = data[i + 2] = 0;
          continue;
        }
        data[i] = r;
        data[i + 1] = g;
        data[i + 2] = b;
      }
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    function edt1d(input, output, length, sites, bounds) {
      let k = 0;
      sites[0] = 0;
      bounds[0] = -Infinity;
      bounds[1] = Infinity;
      for (let q = 1; q < length; q++) {
        let site = sites[k];
        let split = ((input[q] + q * q) - (input[site] + site * site)) / (2 * (q - site));
        while (split <= bounds[k] && k > 0) {
          k -= 1;
          site = sites[k];
          split = ((input[q] + q * q) - (input[site] + site * site)) / (2 * (q - site));
        }
        k += 1;
        sites[k] = q;
        bounds[k] = split;
        bounds[k + 1] = Infinity;
      }
      k = 0;
      for (let q = 0; q < length; q++) {
        while (bounds[k + 1] < q) k += 1;
        const delta = q - sites[k];
        output[q] = delta * delta + input[sites[k]];
      }
    }

    function squaredDistanceTransform(mask, seekInk) {
      const total = SIZE * SIZE;
      const temp = new Float32Array(total);
      const result = new Float32Array(total);
      const input = new Float32Array(SIZE);
      const output = new Float32Array(SIZE);
      const sites = new Int32Array(SIZE);
      const bounds = new Float32Array(SIZE + 1);
      const far = SIZE * SIZE * 4;

      for (let y = 0; y < SIZE; y++) {
        const row = y * SIZE;
        for (let x = 0; x < SIZE; x++) input[x] = Boolean(mask[row + x]) === seekInk ? 0 : far;
        edt1d(input, output, SIZE, sites, bounds);
        temp.set(output, row);
      }
      for (let x = 0; x < SIZE; x++) {
        for (let y = 0; y < SIZE; y++) input[y] = temp[y * SIZE + x];
        edt1d(input, output, SIZE, sites, bounds);
        for (let y = 0; y < SIZE; y++) result[y * SIZE + x] = output[y];
      }
      return result;
    }

    function buildDistanceField(imageData) {
      const total = SIZE * SIZE;
      const mask = new Uint8Array(total);
      for (let i = 0; i < total; i++) mask[i] = imageData.data[i * 4 + 3] > 32 ? 1 : 0;
      const toInk = squaredDistanceTransform(mask, true);
      const toClear = squaredDistanceTransform(mask, false);
      const field = new Float32Array(total);
      for (let i = 0; i < total; i++) {
        field[i] = mask[i] ? -Math.sqrt(toClear[i]) : Math.sqrt(toInk[i]);
      }
      return field;
    }

    function measureInkArea(imageData) {
      let area = 0;
      for (let i = 3; i < imageData.data.length; i += 4) area += imageData.data[i] / 255;
      return area;
    }

    function smoothstep(edge0, edge1, value) {
      const x = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
      return x * x * (3 - 2 * x);
    }

    function drawMorphFrame(fromField, toField, fromIdx, toIdx, t = 1, phase = 0) {
      const eased = easeInOutQuint(t);
      const pixels = morphImage.data;
      const edge = 1.35;
      const histogramMin = -48;
      const histogramMax = 96;
      const histogramScale = morphHistogram.length / (histogramMax - histogramMin);
      morphHistogram.fill(0);

      for (let i = 0; i < fromField.length; i++) {
        const distance = fromField[i] + (toField[i] - fromField[i]) * eased;
        morphDistances[i] = distance;
        const bin = Math.max(0, Math.min(morphHistogram.length - 1, Math.floor((distance - histogramMin) * histogramScale)));
        morphHistogram[bin] += 1;
      }

      const desiredArea = inkAreas[fromIdx] + (inkAreas[toIdx] - inkAreas[fromIdx]) * eased;
      let accumulated = 0;
      let isoBin = 0;
      while (isoBin < morphHistogram.length - 1 && accumulated + morphHistogram[isoBin] < desiredArea) {
        accumulated += morphHistogram[isoBin];
        isoBin += 1;
      }
      const binCount = Math.max(1, morphHistogram[isoBin]);
      const binFraction = Math.max(0, Math.min(1, (desiredArea - accumulated) / binCount));
      const iso = histogramMin + (isoBin + binFraction) / histogramScale;
      const sourceBlend = smoothstep(0, 0.06, t);
      const targetBlend = smoothstep(0.94, 1, t);
      const sourcePixels = bitmaps[fromIdx].data;
      const targetPixels = bitmaps[toIdx].data;

      for (let i = 0; i < morphDistances.length; i++) {
        let alpha = smoothstep(iso + edge, iso - edge, morphDistances[i]);
        if (sourceBlend < 1) alpha += (sourcePixels[i * 4 + 3] / 255 - alpha) * (1 - sourceBlend);
        if (targetBlend > 0) alpha += (targetPixels[i * 4 + 3] / 255 - alpha) * targetBlend;
        const p = i * 4;
        pixels[p] = INK[0];
        pixels[p + 1] = INK[1];
        pixels[p + 2] = INK[2];
        pixels[p + 3] = Math.round(alpha * 255);
      }
      morphCtx.putImageData(morphImage, 0, 0);

      const motion = current?.motion || "pulse";
      const fromAmp = eraAmp(fromIdx);
      const toAmp = eraAmp(toIdx);
      const amp = fromAmp + (toAmp - fromAmp) * eased;
      const era = fromIdx + (toIdx - fromIdx) * eased;
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.save();
      const breath = Math.sin(Math.PI * t);
      ctx.translate(SIZE / 2, SIZE / 2);
      ctx.scale(1 + breath * 0.012, 1 - breath * 0.006);
      ctx.translate(-SIZE / 2, -SIZE / 2);
      drawSemanticLayer(morphCanvas, motion, phase, amp, era);
      ctx.restore();
      drawExtras(motion, phase, amp, era);
    }

    function drawBitmap(i) {
      if (!bitmaps[i]) return;
      ctx.putImageData(bitmaps[i], 0, 0);
    }

    function stopIdle() {
      cancelAnimationFrame(idleRaf);
      idleRaf = 0;
    }

    function startIdle(i) {
      stopIdle();
      idleIdx = i;
      if (!motionEpoch) motionEpoch = performance.now();
      idleT0 = motionEpoch;
      const tick = (now) => {
        if (!current) return;
        paintAlive(i, (now - idleT0) / 1000);
        idleRaf = requestAnimationFrame(tick);
      };
      idleRaf = requestAnimationFrame(tick);
    }

    function eraAmp(i) {
      return [1, 0.88, 0.68, 0.42, 0.26][i] ?? 0.4;
    }

    function drawWarpTriangle(sheet, s0, s1, s2, d0, d1, d2) {
      const det = s0.x * (s1.y - s2.y) + s1.x * (s2.y - s0.y) + s2.x * (s0.y - s1.y);
      if (Math.abs(det) < 0.0001) return;
      const a = (d0.x * (s1.y - s2.y) + d1.x * (s2.y - s0.y) + d2.x * (s0.y - s1.y)) / det;
      const c = (d0.x * (s2.x - s1.x) + d1.x * (s0.x - s2.x) + d2.x * (s1.x - s0.x)) / det;
      const e = (d0.x * (s1.x * s2.y - s2.x * s1.y) + d1.x * (s2.x * s0.y - s0.x * s2.y) + d2.x * (s0.x * s1.y - s1.x * s0.y)) / det;
      const b = (d0.y * (s1.y - s2.y) + d1.y * (s2.y - s0.y) + d2.y * (s0.y - s1.y)) / det;
      const d = (d0.y * (s2.x - s1.x) + d1.y * (s0.x - s2.x) + d2.y * (s1.x - s0.x)) / det;
      const f = (d0.y * (s1.x * s2.y - s2.x * s1.y) + d1.y * (s2.x * s0.y - s0.x * s2.y) + d2.y * (s0.x * s1.y - s1.x * s0.y)) / det;
      const center = { x: (d0.x + d1.x + d2.x) / 3, y: (d0.y + d1.y + d2.y) / 3 };
      const expand = (point) => {
        const vx = point.x - center.x;
        const vy = point.y - center.y;
        const length = Math.hypot(vx, vy) || 1;
        const bleed = 0.9;
        return { x: center.x + vx * (length + bleed) / length, y: center.y + vy * (length + bleed) / length };
      };
      const c0 = expand(d0);
      const c1 = expand(d1);
      const c2 = expand(d2);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(c0.x, c0.y);
      ctx.lineTo(c1.x, c1.y);
      ctx.lineTo(c2.x, c2.y);
      ctx.closePath();
      ctx.clip();
      ctx.transform(a, b, c, d, e, f);
      ctx.drawImage(sheet, 0, 0);
      ctx.restore();
    }

    function drawGridWarp(sheet, offset, tile = 30) {
      ctx.imageSmoothingEnabled = true;
      for (let y = 0; y < SIZE; y += tile) {
        for (let x = 0; x < SIZE; x += tile) {
          const x1 = Math.min(SIZE, x + tile);
          const y1 = Math.min(SIZE, y + tile);
          const s00 = { x, y };
          const s10 = { x: x1, y };
          const s01 = { x, y: y1 };
          const s11 = { x: x1, y: y1 };
          const warp = (p) => {
            const delta = offset(p.x, p.y);
            return { x: p.x + delta.x, y: p.y + delta.y };
          };
          const d00 = warp(s00);
          const d10 = warp(s10);
          const d01 = warp(s01);
          const d11 = warp(s11);
          drawWarpTriangle(sheet, s00, s10, s11, d00, d10, d11);
          drawWarpTriangle(sheet, s00, s11, s01, d00, d11, d01);
        }
      }
    }

    function drawArticulatedLegs(sheet, t, amp, segments, cutY, speed, angle) {
      const reach = (SIZE - cutY) * angle * 1.5;
      drawGridWarp(sheet, (x, y) => {
        const influence = Math.max(0, Math.min(1, (y - cutY + 22) / (SIZE - cutY + 22)));
        const soften = influence * influence * (3 - 2 * influence);
        const phase = t * speed + (x / SIZE) * segments * Math.PI;
        return {
          x: Math.sin(phase) * reach * soften * amp,
          y: -Math.cos(phase) * reach * 0.32 * soften * amp,
        };
      }, 30);
    }

    function drawRollingCart(sheet, t, amp, era) {
      ctx.drawImage(sheet, 0, 0);
      if (era > 1) {
        ctx.save();
        ctx.globalAlpha = 0.16 * amp;
        ctx.translate(Math.sin(t * 5.2) * 1.4 * amp, Math.abs(Math.sin(t * 5.2)) * 1.1 * amp);
        ctx.drawImage(sheet, 0, 0);
        ctx.restore();
        return;
      }
      const wheels = [{ x: 78, y: 150 }, { x: 222, y: 150 }];
      for (const wheel of wheels) {
        ctx.save();
        ctx.globalAlpha = 0.48 + amp * 0.24;
        ctx.beginPath();
        ctx.arc(wheel.x, wheel.y, 53, 0, Math.PI * 2);
        ctx.clip();
        ctx.translate(wheel.x, wheel.y);
        ctx.rotate(t * 2.8 * amp);
        ctx.translate(-wheel.x, -wheel.y);
        ctx.drawImage(sheet, 0, 0);
        ctx.restore();
      }
    }

    function drawSemanticGlyph(sheet, motion, t, amp, era) {
      if (motion === "dragon") {
        drawGridWarp(sheet, (x, y) => {
          const spine = 0.35 + Math.sin((y / SIZE) * Math.PI) * 0.65;
          return {
            x: Math.sin(t * 2.5 + y * 0.035) * 11 * spine * amp,
            y: Math.cos(t * 1.8 + x * 0.025) * 3.2 * spine * amp,
          };
        }, 24);
      } else if (motion === "fly") {
        drawGridWarp(sheet, (x, y) => {
          const wing = Math.min(1, Math.abs(x - SIZE / 2) / (SIZE * 0.32));
          const flap = Math.sin(t * 5.4) * wing * amp;
          return {
            x: Math.sign(x - SIZE / 2) * Math.abs(flap) * 3,
            y: -flap * 13 - Math.sin(t * 2.7 + y * 0.03) * 1.5 * amp,
          };
        }, 24);
      } else if (motion === "crawl") {
        drawArticulatedLegs(sheet, t, amp, 4, 188, 2.2, 0.055);
      } else if (motion === "sail") {
        drawGridWarp(sheet, (x, y) => ({
          x: Math.sin(t * 1.35 + y * 0.017) * 3.2 * amp,
          y: Math.sin(t * 1.8 + x * 0.025) * (0.8 + y / SIZE) * 2.5 * amp,
        }), 26);
      } else if (motion === "prowl") {
        drawArticulatedLegs(sheet, t, amp, 4, 174, 4.2, 0.08);
      } else if (motion === "elephant") {
        drawGridWarp(sheet, (x, y) => {
          const trunk = Math.max(0, Math.min(1, (x - SIZE * 0.52) / (SIZE * 0.3))) * Math.max(0, 1 - y / SIZE);
          const legs = Math.max(0, Math.min(1, (y - SIZE * 0.58) / (SIZE * 0.3)));
          return {
            x: Math.sin(t * 1.65 + y * 0.02) * trunk * 10 * amp + Math.sin(t * 2.4 + x * 0.04) * legs * 2 * amp,
            y: Math.cos(t * 1.65 + x * 0.018) * trunk * 5 * amp - Math.abs(Math.sin(t * 2.4 + x * 0.035)) * legs * 2.5 * amp,
          };
        }, 24);
      } else if (motion === "swim") {
        if (era < 2) {
          drawGridWarp(sheet, (x) => ({ x: 0, y: Math.sin(t * 3.6 + x * 0.035) * Math.pow(x / SIZE, 1.8) * 12 * amp }), 30);
        } else {
          drawGridWarp(sheet, (x, y) => ({ x: Math.sin(t * 3.4 + y * 0.038) * Math.pow(y / SIZE, 1.7) * 8 * amp, y: Math.sin(t * 1.7 + x * 0.02) * 1.2 * amp }), 30);
        }
      } else if (motion === "gallop") {
        drawArticulatedLegs(sheet, t, amp, 4, 168, 7.2, 0.12);
      } else if (motion === "walk") {
        drawArticulatedLegs(sheet, t, amp, 2, 154, 3.6, 0.095);
      } else if (motion === "cart") {
        drawRollingCart(sheet, t, amp, era);
      } else if (motion === "fire") {
        drawGridWarp(sheet, (x, y) => {
          const lift = Math.pow(1 - y / SIZE, 1.45);
          return { x: Math.sin(t * 4.8 + y * 0.042 + x * 0.012) * lift * 7 * amp, y: -Math.abs(Math.sin(t * 5.6 + x * 0.035)) * lift * 5 * amp };
        }, 30);
      } else if (motion === "tree") {
        drawGridWarp(sheet, (x, y) => {
          const canopy = Math.pow(1 - y / SIZE, 2);
          return { x: Math.sin(t * 1.25 + y * 0.016) * canopy * 10 * amp, y: Math.cos(t * 0.8 + x * 0.012) * canopy * 1.6 * amp };
        });
      } else if (motion === "water") {
        drawGridWarp(sheet, (x, y) => ({ x: Math.sin(t * 2.15 + y * 0.04) * 4.6 * amp, y: Math.sin(t * 1.5 + x * 0.03) * 2.2 * amp }), 30);
      } else if (motion === "rain") {
        drawGridWarp(sheet, (x, y) => {
          const fall = Math.max(0, Math.min(1, (y - 112) / 190));
          return {
            x: Math.sin(t * 1.6 + y * 0.018) * fall * 1.5 * amp,
            y: (Math.sin(t * 3.2 + x * 0.026) + 1) * fall * 3.4 * amp,
          };
        });
      } else if (motion === "mountain") {
        drawGridWarp(sheet, (x, y) => {
          const height = Math.pow(1 - y / SIZE, 1.25);
          return { x: 0, y: Math.sin(t * 0.62 + x * 0.018) * 1.8 * height * amp };
        });
      } else if (motion === "home") {
        drawGridWarp(sheet, (x, y) => {
          const inside = Math.max(0, Math.min(1, (y - 106) / 122));
          const breath = Math.sin(t * 1.45) * inside * amp;
          return { x: (x - SIZE / 2) * breath * 0.012, y: (y - 190) * breath * 0.006 };
        });
      } else if (motion === "glow") {
        drawGridWarp(sheet, (x, y) => {
          const side = Math.tanh((x - SIZE / 2) / 64);
          return {
            x: -side * Math.sin(t * 2.1) * 2.2 * amp,
            y: (0.5 + 0.5 * side) * Math.sin(t * 1.2) * 4.2 * amp,
          };
        });
      } else if (motion === "moon") {
        drawGridWarp(sheet, (x, y) => ({ x: Math.sin(t * 1.35 + y * 0.022) * 3.2 * amp, y: Math.sin(t * 0.92 + x * 0.018) * 2.4 * amp }));
      } else if (motion === "dawn") {
        drawGridWarp(sheet, (x, y) => ({ x: Math.sin(t * 0.85 + y * 0.018) * 1.8 * amp, y: -Math.sin(t * 0.72) * Math.pow(1 - y / SIZE, 1.4) * 5 * amp }));
      } else if (motion === "sun") {
        ctx.save();
        const pulse = 1 + Math.sin(t * 1.65) * 0.025 * amp;
        ctx.translate(SIZE / 2, SIZE / 2);
        ctx.scale(pulse, pulse);
        ctx.drawImage(sheet, -SIZE / 2, -SIZE / 2);
        ctx.restore();
      } else {
        ctx.drawImage(sheet, 0, 0);
      }
    }

    function drawSemanticLayer(sheet, motion, t, amp, era) {
      ctx.save();
      ctx.translate(SIZE / 2, SIZE / 2);

      if (motion === "dragon") {
        ctx.translate(Math.sin(t * 1.7) * 5 * amp, Math.cos(t * 1.25) * 5 * amp);
        ctx.rotate(Math.sin(t * 1.4) * 0.025 * amp);
      } else if (motion === "fly") {
        ctx.translate(Math.sin(t * 1.9) * 4 * amp, Math.sin(t * 3.1) * 5 * amp);
        ctx.rotate(Math.sin(t * 1.9) * 0.025 * amp);
      } else if (motion === "crawl") {
        ctx.translate(Math.sin(t * 2.2) * 2.2 * amp, -Math.abs(Math.sin(t * 2.2)) * 1.2 * amp);
      } else if (motion === "sail") {
        ctx.translate(Math.sin(t * 1.4) * 3 * amp, Math.sin(t * 1.8) * 2.2 * amp);
        ctx.rotate(Math.sin(t * 1.4) * 0.018 * amp);
      } else if (motion === "prowl") {
        ctx.translate(Math.sin(t * 4.2) * 2.2 * amp, -Math.abs(Math.sin(t * 4.2)) * 2.5 * amp);
        ctx.rotate(Math.sin(t * 4.2) * 0.012 * amp);
      } else if (motion === "elephant") {
        ctx.translate(Math.sin(t * 2.4) * 1.4 * amp, -Math.abs(Math.sin(t * 2.4)) * 1.3 * amp);
      } else if (motion === "gallop") {
        const beat = t * 7.2;
        ctx.translate(Math.sin(beat) * 1.8 * amp, -Math.abs(Math.sin(beat * 2)) * 3.8 * amp);
        ctx.rotate(Math.sin(beat) * 0.014 * amp);
      } else if (motion === "swim") {
        ctx.translate(Math.sin(t * 1.6) * 5 * amp, Math.sin(t * 1.05) * 2.4 * amp);
        ctx.rotate(Math.sin(t * 1.6) * 0.018 * amp);
      } else if (motion === "cart") {
        ctx.translate(Math.sin(t * 4.8) * 1.1 * amp, -Math.abs(Math.sin(t * 4.8)) * 1.2 * amp);
      } else if (motion === "walk") {
        ctx.translate(Math.sin(t * 3.2) * 1.5 * amp, -Math.abs(Math.sin(t * 6.4)) * 2 * amp);
        ctx.rotate(Math.sin(t * 3.2) * 0.012 * amp);
      } else if (motion === "fire") {
        ctx.translate(0, Math.sin(t * 2.8) * 1.2 * amp);
      } else {
        ctx.translate(0, Math.sin(t * 1.2) * 1.4 * amp);
      }

      ctx.translate(-SIZE / 2, -SIZE / 2);
      drawSemanticGlyph(sheet, motion, t, amp, era);
      ctx.restore();
    }

    function paintAlive(i, t) {
      const sheet = glyphSheets[i];
      if (!sheet) {
        drawBitmap(i);
        return;
      }
      const amp = eraAmp(i);
      const motion = current.motion || "pulse";
      ctx.clearRect(0, 0, SIZE, SIZE);
      drawSemanticLayer(sheet, motion, t, amp, i);
      drawExtras(motion, t, amp, i);
    }

    function drawExtras(motion, t, amp, i) {
      ctx.save();
      ctx.fillStyle = "rgba(230,223,208,0.55)";
      ctx.strokeStyle = "rgba(230,223,208,0.28)";
      ctx.lineWidth = 1;

      if (motion === "dragon") {
        ctx.globalAlpha = 0.16 + amp * 0.16;
        for (let k = 0; k < 10; k++) {
          const sp = specks[k];
          const x = (sp.x * SIZE + t * (16 + sp.s * 10)) % SIZE;
          const y = SIZE * 0.2 + sp.y * SIZE * 0.55 + Math.sin(t + sp.p) * 12;
          ctx.beginPath();
          ctx.arc(x, y, 7 + sp.s * 7, Math.PI * 0.15, Math.PI * 0.85);
          ctx.stroke();
        }
      }

      if (motion === "fly") {
        for (let k = 0; k < 12; k++) {
          const sp = specks[k];
          const x = SIZE * 0.78 - ((t * (35 + sp.s * 22) + sp.p * 18) % (SIZE * 0.64));
          const y = SIZE * 0.32 + sp.y * SIZE * 0.42 + Math.sin(t * 2 + sp.p) * 10;
          ctx.globalAlpha = 0.12 + 0.25 * amp;
          ctx.beginPath();
          ctx.ellipse(x, y, 3.4 * sp.s, 0.8, sp.p, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "crawl" || motion === "prowl" || motion === "elephant") {
        const speed = motion === "prowl" ? 65 : motion === "elephant" ? 28 : 18;
        for (let k = 0; k < 10; k++) {
          const sp = specks[k];
          const x = SIZE * 0.72 - ((t * speed + sp.p * 18) % (SIZE * 0.55));
          const y = SIZE * 0.76 + sp.y * 12;
          ctx.globalAlpha = (0.1 + sp.s * 0.16) * amp;
          ctx.beginPath();
          ctx.arc(x, y, 0.8 + sp.s * 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "sail") {
        ctx.globalAlpha = 0.16 + 0.18 * amp;
        for (let row = 0; row < 3; row++) {
          ctx.beginPath();
          for (let x = 28; x <= SIZE - 28; x += 5) {
            const y = SIZE * (0.7 + row * 0.045) + Math.sin(x * 0.055 + t * (2 + row * 0.35)) * (4 + row * 1.5) * amp;
            if (x === 28) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
      }

      if (motion === "gallop") {
        for (let k = 0; k < 12; k++) {
          const sp = specks[k];
          const x = SIZE * 0.72 - ((t * (70 + sp.s * 40) + sp.p * 40) % (SIZE * 0.7));
          const y = SIZE * 0.72 + Math.sin(t * 8 + sp.p) * 10 * amp + sp.y * 18;
          ctx.globalAlpha = 0.15 + 0.35 * amp * (1 - (x / SIZE));
          ctx.beginPath();
          ctx.arc(x, y, 1.2 * sp.s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "fire") {
        for (let k = 0; k < 16; k++) {
          const sp = specks[k];
          const y = SIZE * 0.78 - ((t * (40 + sp.s * 50) + sp.p * 30) % (SIZE * 0.55));
          const x = SIZE * 0.5 + Math.sin(y * 0.05 + sp.p) * 28 * amp;
          ctx.globalAlpha = 0.12 + 0.4 * amp * (y / SIZE);
          ctx.beginPath();
          ctx.arc(x, y, 1.1 * sp.s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "rain") {
        ctx.globalAlpha = 0.28 * amp + 0.12;
        for (let k = 0; k < 18; k++) {
          const sp = specks[k];
          const y = ((t * (90 + sp.s * 40) + sp.y * SIZE) % SIZE);
          const x = sp.x * SIZE;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 2, y + 10 + sp.s * 6);
          ctx.stroke();
        }
      }

      if (motion === "water") {
        ctx.globalAlpha = 0.2 * amp + 0.1;
        ctx.beginPath();
        for (let x = 40; x < SIZE - 40; x += 6) {
          const y = SIZE * 0.78 + Math.sin(x * 0.08 + t * 3) * 5 * amp;
          if (x === 40) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      if (motion === "sun") {
        ctx.translate(SIZE / 2, SIZE / 2);
        ctx.rotate(t * 0.25);
        ctx.globalAlpha = 0.16 * amp;
        for (let k = 0; k < 12; k++) {
          ctx.rotate(Math.PI / 6);
          ctx.beginPath();
          ctx.moveTo(0, 92);
          ctx.lineTo(0, 118 + Math.sin(t * 2 + k) * 8);
          ctx.stroke();
        }
      }

      if (motion === "tree") {
        ctx.globalAlpha = 0.3 * amp;
        for (let k = 0; k < 8; k++) {
          const sp = specks[k];
          const y = ((t * 22 * sp.s + sp.y * SIZE) % (SIZE * 0.5)) + SIZE * 0.2;
          const x = SIZE * 0.35 + sp.x * SIZE * 0.3 + Math.sin(t + sp.p) * 12;
          ctx.beginPath();
          ctx.ellipse(x, y, 2.2, 1.1, sp.p, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "home") {
        ctx.globalAlpha = 0.22 * amp;
        for (let k = 0; k < 7; k++) {
          const sp = specks[k];
          const y = SIZE * 0.28 - ((t * 16 + sp.p * 10) % 50);
          const x = SIZE * 0.5 + Math.sin(t * 1.2 + sp.p) * 8;
          ctx.beginPath();
          ctx.arc(x, y, 1.4 + sp.s, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "cart") {
        ctx.globalAlpha = 0.2 * amp;
        for (let k = 0; k < 10; k++) {
          const sp = specks[k];
          const x = SIZE * 0.78 - ((t * 80 + sp.p * 20) % (SIZE * 0.6));
          const y = SIZE * 0.74 + sp.y * 12;
          ctx.beginPath();
          ctx.arc(x, y, 1.1, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (motion === "dawn") {
        ctx.globalAlpha = 0.12 + 0.18 * amp * (0.5 + 0.5 * Math.sin(t));
        ctx.beginPath();
        ctx.arc(SIZE / 2, SIZE * 0.42, 70 + Math.sin(t) * 8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function morphBetween(fromIdx, toIdx, duration) {
      const t0 = performance.now();
      stopIdle();
      cancelAnimationFrame(morphRaf);
      glyphFrame.classList.add("morphing");
      const fromField = distanceFields[fromIdx];
      const toField = distanceFields[toIdx];
      return new Promise((resolve) => {
        const tick = (now) => {
          if (!current) return resolve();
          const t = Math.min(1, (now - t0) / duration);
          const phase = (now - (motionEpoch || t0)) / 1000;
          worldBlend = easeInOutQuint(t);
          drawMorphFrame(fromField, toField, fromIdx, toIdx, t, phase);
          if (t < 1) morphRaf = requestAnimationFrame(tick);
          else {
            worldBlend = 1;
            glyphFrame.classList.remove("morphing");
            startIdle(toIdx);
            resolve();
          }
        };
        morphRaf = requestAnimationFrame(tick);
      });
    }

    async function prepareMorphs(story) {
      bitmaps = [];
      distanceFields = [];
      inkAreas = [];
      glyphSheets = [];
      for (const form of story.forms) {
        const img = await rasterizeForm(form);
        bitmaps.push(img);
        distanceFields.push(buildDistanceField(img));
        inkAreas.push(measureInkArea(img));
        const sheet = document.createElement("canvas");
        sheet.width = SIZE;
        sheet.height = SIZE;
        sheet.getContext("2d").putImageData(img, 0, 0);
        glyphSheets.push(sheet);
      }
    }

    function typeText(text) {
      clearInterval(typing);
      lineEl.innerHTML = "";
      const fragment = document.createDocumentFragment();
      [...text].forEach((character, index) => {
        const span = document.createElement("span");
        span.className = "char";
        span.textContent = character;
        span.style.animationDelay = `${index * 22}ms`;
        fragment.appendChild(span);
      });
      lineEl.appendChild(fragment);
      return wait(Math.min(1450, 620 + text.length * 22));
    }

    function wait(ms) {
      return new Promise((resolve) => {
        const end = performance.now() + ms;
        const tick = () => {
          if (!current) return resolve();
          if (!paused && performance.now() >= end) return resolve();
          autoTimer = setTimeout(tick, paused ? 120 : 40);
        };
        tick();
      });
    }

    function setDots() {
      dotsEl.innerHTML = current.texts
        .map((_, i) => `<span class="dot${i === chapter ? " on" : ""}"></span>`)
        .join("");
    }

    async function showChapter(i, { morphFrom } = {}) {
      if (!current || i < 0 || i >= current.texts.length) return;
      chapter = i;
      setNarrativeBeat(i);
      chapterEl.textContent = `${String(i + 1).padStart(2, "0")} / ${String(current.texts.length).padStart(2, "0")}`;
      setProgress(i, current.texts.length);
      setDots();
      eraEl.classList.remove("show");
      storyCopy.classList.add("changing");
      await wait(morphFrom != null ? 40 : 60);
      if (morphFrom != null) {
        worldFrom = morphFrom;
        worldTo = i;
        worldBlend = 0;
        await morphBetween(morphFrom, i, MORPH_MS);
      } else {
        worldFrom = i;
        worldTo = i;
        worldBlend = 1;
        startIdle(i);
      }
      const actNames = ["诞生", "扩张", "定形", "裂变", "回响"];
      eraEl.textContent = `${ERAS[i]} · ${actNames[i]}`;
      lineEl.innerHTML = "";
      storyCopy.classList.remove("changing");
      requestAnimationFrame(() => eraEl.classList.add("show"));
      ensureAudio();
      if (guqinElement) guqinElement.playbackRate = [0.9, 0.93, 0.96, 0.98, 1][i] || 0.96;
      playCeremonialGong(i === 0 ? 0.62 : i === 3 ? 1 : 0.36);
      playTone(260 + i * 54, 0.12);
      const emotionalHold = Math.min(4200, 2500 + current.texts[i].length * 28);
      await Promise.all([
        typeText(current.texts[i]),
        speak(current.texts[i]),
        wait(emotionalHold),
      ]);
    }

    async function autoPlay() {
      const token = ++playToken;
      autoPlaying = true;
      paused = false;
      btnPlay.textContent = "暂停";
      btnPlay.setAttribute("aria-label", "暂停播放");
      hintTap.textContent = "演化中…";
      hintTap.classList.add("show");
      coldOpen.classList.add("show");
      ctx.clearRect(0, 0, SIZE, SIZE);
      void preloadNarration(current.texts);
      await prepareMorphs(current);
      if (token !== playToken) return;

      motionEpoch = performance.now();
      drawBitmap(0);
      startIdle(0);
      await wait(1850);
      if (token !== playToken) return;
      coldOpen.classList.remove("show");
      await wait(520);
      if (token !== playToken) return;

      await showChapter(0);
      if (token !== playToken) return;

      for (let i = 1; i < current.texts.length; i++) {
        await wait(260);
        if (token !== playToken) return;
        await showChapter(i, { morphFrom: i - 1 });
        if (token !== playToken) return;
      }

      autoPlaying = false;
      paused = false;
      btnPlay.textContent = "重播";
      btnPlay.setAttribute("aria-label", "重新播放");
      hintTap.textContent = "重播这三千年";
      if (recording) stopRecording();
    }

    function openStory(id) {
      current = STORIES.find((s) => s.id === id);
      if (!current) return;
      clearTimeout(storyHideTimer);
      storyHideTimer = 0;
      gallery.classList.add("hidden");
      storyEl.classList.remove("hidden");
      storyEl.classList.remove("ready");
      const storyNumber = STORIES.indexOf(current) + 1;
      coldIndex.textContent = `${String(storyNumber).padStart(2, "0")} · ${current.glyph}`;
      coldHook.textContent = current.hook || "一个字，如何穿过三千年？";
      coldOpen.classList.add("show");
      eraEl.textContent = "序章";
      lineEl.textContent = current.payoff || "一笔落下，时间开始显形。";
      ensureAudio();
      if (musicBus && audioCtx) musicBus.gain.setTargetAtTime(soundOn ? 0.72 : 0, audioCtx.currentTime, 0.3);
      startAcousticScore();
      voiceState.textContent = soundOn ? "声音已开启 · 真实古琴配乐 + MiMo「白桦」男声" : "声音已关闭";
      startWorld(0);
      requestAnimationFrame(() => requestAnimationFrame(() => storyEl.classList.add("ready")));
      autoPlay();
    }

    function closeStory() {
      playToken += 1;
      autoPlaying = false;
      paused = false;
      clearInterval(typing);
      typing = null;
      clearTimeout(autoTimer);
      cancelAnimationFrame(morphRaf);
      stopRecording();
      stopNarration();
      if (musicBus && audioCtx) musicBus.gain.setTargetAtTime(0, audioCtx.currentTime, 0.35);
      if (guqinElement) guqinElement.pause();
      if (gongElement) gongElement.pause();
      stopIdle();
      stopWorld();
      glyphFrame.classList.remove("morphing");
      storyCopy.classList.remove("changing");
      coldOpen.classList.remove("show");
      delete storyEl.dataset.beat;
      hintTap.classList.remove("show");
      ctx.clearRect(0, 0, SIZE, SIZE);
      bitmaps = [];
      distanceFields = [];
      inkAreas = [];
      glyphSheets = [];
      motionEpoch = 0;
      current = null;
      storyEl.classList.remove("ready");
      gallery.classList.remove("hidden");
      clearTimeout(storyHideTimer);
      storyHideTimer = setTimeout(() => {
        storyEl.classList.add("hidden");
        storyHideTimer = 0;
      }, 520);
    }

    function onStoryTap() {
      if (!current) return;
      if (autoPlaying) return;
      closeStory();
    }

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest(".card");
      if (btn) openStory(btn.dataset.id);
    });

    tap.addEventListener("click", onStoryTap);
    document.querySelector(".story-copy").addEventListener("click", onStoryTap);
    document.getElementById("btnBack").addEventListener("click", closeStory);
    document.getElementById("btnSkip").addEventListener("click", closeStory);
    btnSound.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleSound();
    });
    btnPlay.addEventListener("click", (event) => {
      event.stopPropagation();
      ensureAudio();
      if (!current) return;
      if (!autoPlaying) return autoPlay();
      paused = !paused;
      btnPlay.textContent = paused ? "继续" : "暂停";
      btnPlay.setAttribute("aria-label", paused ? "继续播放" : "暂停播放");
      hintTap.textContent = paused ? "已暂停" : "演化中…";
    });
    btnRecord.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!recording && !autoPlaying) autoPlay();
      startRecording();
    });
    window.addEventListener("resize", () => {
      if (document.body.classList.contains("film")) resizeWorld();
    });
    document.addEventListener("keydown", (e) => {
      if (storyEl.classList.contains("hidden")) return;
      if (e.key === "Escape") closeStory();
    });

    const loadGlyphs = window.GLYPHS
      ? Promise.resolve(window.GLYPHS)
      : fetch("./glyphs.json").then((r) => {
          if (!r.ok) throw new Error(`glyphs.json ${r.status}`);
          return r.json();
        });

    loadGlyphs
      .then((data) => {
        ERAS = data.ERAS;
        STORIES = data.STORIES;
        document.getElementById("storyCount").textContent = `${STORIES.length} 个字`;
        renderGallery();
      })
      .catch((err) => {
        console.error(err);
        grid.innerHTML = `<p style="grid-column:1/-1;color:#8f8778;text-align:center;letter-spacing:0.12em">字库加载失败，请刷新页面</p>`;
      });
  </script>
</body>
</html>
